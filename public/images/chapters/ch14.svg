<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Soft Rainy Day Gradient -->
    <linearGradient id="rainySky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="40%" stop-color="#94a3b8" />
      <stop offset="85%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Translucent Clear Umbrella Gradient -->
    <linearGradient id="umbrellaVinyl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#e0f2fe" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.3" />
    </linearGradient>

    <!-- Warm Shop Light Glow -->
    <radialGradient id="shopGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#b45309" stop-opacity="0" />
    </radialGradient>

    <filter id="rainShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.3" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#rainySky)" />

  <!-- RAIN STREAKS DIAGONAL LINES -->
  <g stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.35">
    <line x1="200" y1="0" x2="150" y2="120" />
    <line x1="280" y1="20" x2="230" y2="140" />
    <line x1="360" y1="10" x2="310" y2="130" />
    <line x1="450" y1="40" x2="400" y2="160" />
    <line x1="540" y1="0" x2="490" y2="120" />
    <line x1="620" y1="30" x2="570" y2="150" />
    <line x1="700" y1="10" x2="650" y2="130" />
    <line x1="770" y1="50" x2="720" y2="170" />
    <line x1="230" y1="160" x2="180" y2="280" />
    <line x1="320" y1="180" x2="270" y2="300" />
    <line x1="410" y1="170" x2="360" y2="290" />
    <line x1="500" y1="200" x2="450" y2="320" />
    <line x1="590" y1="160" x2="540" y2="280" />
    <line x1="680" y1="190" x2="630" y2="310" />
    <line x1="750" y1="170" x2="700" y2="290" />
  </g>

  <!-- Cozy Tokyo Ramen Shop Awning & Window (Right Side) -->
  <g transform="translate(520, 100)" filter="url(#rainShadow)">
    <circle cx="100" cy="80" r="90" fill="url(#shopGlow)" />
    <!-- Wooden Window Frame -->
    <rect x="0" y="20" width="220" height="180" fill="#fef3c7" stroke="#78350f" stroke-width="6" rx="4" opacity="0.85" />
    <line x1="110" y1="20" x2="110" y2="200" stroke="#78350f" stroke-width="4" />
    <line x1="0" y1="110" x2="220" y2="110" stroke="#78350f" stroke-width="4" />
    <!-- Red Noren Curtain -->
    <rect x="-10" y="0" width="240" height="45" fill="#dc2626" rx="2" />
    <text x="110" y="28" font-family="'Noto Sans JP', sans-serif" font-size="16" font-weight="900" fill="#ffffff" text-anchor="middle">ラーメン</text>
  </g>

  <!-- Wet Street Reflection Surface -->
  <polygon points="0,320 800,300 800,450 0,450" fill="#334155" />
  <line x1="0" y1="320" x2="800" y2="300" stroke="#64748b" stroke-width="2" />

  <!-- Water Puddles with Warm Light Reflection -->
  <ellipse cx="620" cy="360" rx="95" ry="18" fill="#f59e0b" opacity="0.4" />
  <ellipse cx="620" cy="360" rx="80" ry="14" fill="#fef08a" opacity="0.6" />
  <ellipse cx="380" cy="380" rx="75" ry="14" fill="#38bdf8" opacity="0.3" />

  <!-- JAPANESE CLEAR VINYL UMBRELLA (KASA: HERO ELEMENT) -->
  <g transform="translate(320, 140)" filter="url(#rainShadow)">
    <!-- Shaft & Handle -->
    <line x1="100" y1="25" x2="100" y2="240" stroke="#0f172a" stroke-width="4.5" stroke-linecap="round" />
    <!-- Curved J Handle -->
    <path d="M100,240 C100,265 125,265 125,245" fill="none" stroke="#0f172a" stroke-width="5" stroke-linecap="round" />

    <!-- Dome Canopy (Translucent Vinyl) -->
    <path d="M10,120 C20,30 180,30 190,120 C160,110 130,115 100,110 C70,115 40,110 10,120 Z" fill="url(#umbrellaVinyl)" stroke="#cbd5e1" stroke-width="2" />

    <!-- Umbrella Ribs -->
    <path d="M100,35 Q60,75 50,114" fill="none" stroke="#94a3b8" stroke-width="1.5" />
    <path d="M100,35 Q85,75 80,112" fill="none" stroke="#94a3b8" stroke-width="1.5" />
    <path d="M100,35 Q115,75 120,112" fill="none" stroke="#94a3b8" stroke-width="1.5" />
    <path d="M100,35 Q140,75 150,114" fill="none" stroke="#94a3b8" stroke-width="1.5" />

    <!-- Raindrops Beading on Canopy Surface -->
    <circle cx="70" cy="65" r="3" fill="#ffffff" opacity="0.9" />
    <circle cx="120" cy="72" r="3.5" fill="#ffffff" opacity="0.9" />
    <circle cx="95" cy="50" r="2.5" fill="#ffffff" opacity="0.9" />
    <circle cx="145" cy="90" r="3" fill="#ffffff" opacity="0.9" />
    <!-- Dripping Drop -->
    <ellipse cx="10" cy="126" rx="2" ry="3.5" fill="#38bdf8" />
  </g>
</svg>
