<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Market Morning Amber & Red Gradient -->
    <linearGradient id="marketBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2" />
      <stop offset="50%" stop-color="#fef2f2" />
      <stop offset="100%" stop-color="#fee2e2" />
    </linearGradient>

    <!-- Crisp Red Apple Gradient -->
    <radialGradient id="appleRed" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="40%" stop-color="#ef4444" />
      <stop offset="85%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </radialGradient>

    <!-- Wood Crate Gradient -->
    <linearGradient id="crateWood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <filter id="crateShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#7f1d1d" flood-opacity="0.2" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#marketBg)" />

  <!-- Market Awning Stripes at Top -->
  <g>
    <polygon points="400,0 440,0 420,50 380,50" fill="#ef4444" />
    <polygon points="440,0 480,0 460,50 420,50" fill="#ffffff" />
    <polygon points="480,0 520,0 500,50 460,50" fill="#ef4444" />
    <polygon points="520,0 560,0 540,50 500,50" fill="#ffffff" />
    <polygon points="560,0 600,0 580,50 540,50" fill="#ef4444" />
    <polygon points="600,0 640,0 620,50 580,50" fill="#ffffff" />
    <polygon points="640,0 680,0 660,50 620,50" fill="#ef4444" />
    <polygon points="680,0 720,0 700,50 660,50" fill="#ffffff" />
    <polygon points="720,0 760,0 740,50 700,50" fill="#ef4444" />
    <polygon points="760,0 800,0 780,50 740,50" fill="#ffffff" />
  </g>

  <!-- Market Counter Table -->
  <polygon points="0,320 800,300 800,450 0,450" fill="#b45309" />
  <line x1="0" y1="320" x2="800" y2="300" stroke="#fcd34d" stroke-width="3" opacity="0.6" />

  <!-- WOODEN CRATE WITH CRISP APPLES (RINGO: HERO ELEMENT) -->
  <g transform="translate(320, 180)" filter="url(#crateShadow)">
    <!-- Back of crate -->
    <rect x="20" y="50" width="220" height="100" fill="#78350f" rx="6" />

    <!-- Apples inside Crate -->
    <!-- Row 2 (back) -->
    <g transform="translate(45, 30)">
      <circle cx="25" cy="40" r="28" fill="url(#appleRed)" />
      <path d="M25,12 Q28,5 34,2" stroke="#78350f" stroke-width="3" fill="none" stroke-linecap="round" />
      <ellipse cx="20" cy="30" rx="6" ry="3" fill="#ffffff" opacity="0.6" />
    </g>
    <g transform="translate(95, 25)">
      <circle cx="25" cy="40" r="28" fill="url(#appleRed)" />
      <path d="M25,12 Q28,5 34,2" stroke="#78350f" stroke-width="3" fill="none" stroke-linecap="round" />
      <ellipse cx="20" cy="30" rx="6" ry="3" fill="#ffffff" opacity="0.6" />
    </g>
    <g transform="translate(145, 32)">
      <circle cx="25" cy="40" r="28" fill="url(#appleRed)" />
      <path d="M25,12 Q28,5 34,2" stroke="#78350f" stroke-width="3" fill="none" stroke-linecap="round" />
      <ellipse cx="20" cy="30" rx="6" ry="3" fill="#ffffff" opacity="0.6" />
    </g>

    <!-- Row 1 (front) -->
    <g transform="translate(20, 60)">
      <circle cx="30" cy="40" r="32" fill="url(#appleRed)" />
      <path d="M30,8 Q34,0 42,-2" stroke="#78350f" stroke-width="3.5" fill="none" stroke-linecap="round" />
      <ellipse cx="24" cy="28" rx="8" ry="4" fill="#ffffff" opacity="0.7" />
    </g>
    <g transform="translate(75, 55)">
      <circle cx="30" cy="40" r="32" fill="url(#appleRed)" />
      <path d="M30,8 Q34,0 42,-2" stroke="#78350f" stroke-width="3.5" fill="none" stroke-linecap="round" />
      <ellipse cx="24" cy="28" rx="8" ry="4" fill="#ffffff" opacity="0.7" />
      <!-- Green Leaf -->
      <path d="M30,8 Q45,6 48,-4 Q38,-2 30,8 Z" fill="#22c55e" />
    </g>
    <g transform="translate(130, 58)">
      <circle cx="30" cy="40" r="32" fill="url(#appleRed)" />
      <path d="M30,8 Q34,0 42,-2" stroke="#78350f" stroke-width="3.5" fill="none" stroke-linecap="round" />
      <ellipse cx="24" cy="28" rx="8" ry="4" fill="#ffffff" opacity="0.7" />
    </g>
    <g transform="translate(180, 62)">
      <circle cx="30" cy="40" r="32" fill="url(#appleRed)" />
      <path d="M30,8 Q34,0 42,-2" stroke="#78350f" stroke-width="3.5" fill="none" stroke-linecap="round" />
      <ellipse cx="24" cy="28" rx="8" ry="4" fill="#ffffff" opacity="0.7" />
    </g>

    <!-- Front Wooden Slats of Crate -->
    <rect x="10" y="80" width="240" height="24" rx="4" fill="url(#crateWood)" stroke="#78350f" stroke-width="1.5" />
    <rect x="10" y="110" width="240" height="24" rx="4" fill="url(#crateWood)" stroke="#78350f" stroke-width="1.5" />
    <rect x="10" y="140" width="240" height="26" rx="4" fill="url(#crateWood)" stroke="#78350f" stroke-width="1.5" />

    <!-- Corner Corner Brackets & Screws -->
    <rect x="8" y="75" width="14" height="95" rx="3" fill="#92400e" />
    <rect x="238" y="75" width="14" height="95" rx="3" fill="#92400e" />
    <circle cx="15" cy="85" r="2.5" fill="#18181b" />
    <circle cx="15" cy="120" r="2.5" fill="#18181b" />
    <circle cx="15" cy="155" r="2.5" fill="#18181b" />
    <circle cx="245" cy="85" r="2.5" fill="#18181b" />
    <circle cx="245" cy="120" r="2.5" fill="#18181b" />
    <circle cx="245" cy="155" r="2.5" fill="#18181b" />

    <!-- Japanese Price Card (Woodclip) -->
    <g transform="translate(90, 105)">
      <rect x="0" y="0" width="85" height="42" rx="6" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5" />
      <text x="42.5" y="18" font-family="'Noto Sans JP', sans-serif" font-size="11" font-weight="900" fill="#991b1b" text-anchor="middle">りんご 4つ</text>
      <text x="42.5" y="34" font-family="sans-serif" font-size="13" font-weight="900" fill="#1e293b" text-anchor="middle">500円</text>
    </g>
  </g>

  <!-- POSTAGE STAMP & ENVELOPE (DURATION / MAILING) -->
  <g transform="translate(180, 290) rotate(8)" filter="url(#crateShadow)">
    <rect x="0" y="0" width="90" height="65" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <!-- Airmail Blue/Red Edge -->
    <line x1="0" y1="2" x2="90" y2="2" stroke="#ef4444" stroke-width="3" stroke-dasharray="8 6" />
    <!-- Japanese 84-yen Stamp with Sakura -->
    <g transform="translate(60, 8)">
      <rect x="0" y="0" width="22" height="26" fill="#fbcfe8" stroke="#f43f5e" stroke-width="1" />
      <circle cx="11" cy="11" r="6" fill="#ec4899" />
      <text x="11" y="23" font-size="7" font-weight="bold" fill="#be123c" text-anchor="middle">84</text>
    </g>
  </g>
</svg>
