<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Cyber Tokyo Sunset / Violet Neon Gradient -->
    <linearGradient id="musicBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e1065" />
      <stop offset="50%" stop-color="#581c87" />
      <stop offset="100%" stop-color="#3b0764" />
    </linearGradient>

    <!-- Neon Glow Gradient -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <radialGradient id="stageGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#581c87" stop-opacity="0" />
    </radialGradient>

    <filter id="neonFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#musicBg)" />
  <circle cx="500" cy="220" r="180" fill="url(#stageGlow)" />

  <!-- Equalizer Sound Wave Bars in Background -->
  <g opacity="0.3" fill="url(#neonCyan)">
    <rect x="250" y="240" width="8" height="50" rx="4" />
    <rect x="270" y="210" width="8" height="80" rx="4" />
    <rect x="290" y="180" width="8" height="110" rx="4" />
    <rect x="310" y="220" width="8" height="70" rx="4" />
    <rect x="330" y="160" width="8" height="130" rx="4" />
    <rect x="350" y="230" width="8" height="60" rx="4" />
    <rect x="650" y="200" width="8" height="90" rx="4" />
    <rect x="670" y="170" width="8" height="120" rx="4" />
    <rect x="690" y="220" width="8" height="70" rx="4" />
    <rect x="710" y="190" width="8" height="100" rx="4" />
  </g>

  <!-- Musical Notes Floating -->
  <g fill="#f472b6" opacity="0.8" filter="url(#neonFilter)">
    <!-- Eighth note -->
    <path d="M420,100 A12,12 0 1,1 408,88 L408,40 L445,30 L445,60" stroke="#f472b6" stroke-width="4" fill="#f472b6" />
    <!-- Beamed notes -->
    <g transform="translate(620, 80) scale(0.8)">
      <circle cx="20" cy="50" r="12" />
      <circle cx="65" cy="40" r="12" />
      <line x1="31" y1="50" x2="31" y2="10" stroke="#f472b6" stroke-width="5" />
      <line x1="76" y1="40" x2="76" y2="0" stroke="#f472b6" stroke-width="5" />
      <polygon points="31,10 76,0 76,14 31,24" />
    </g>
  </g>

  <!-- ELECTRIC GUITAR (Hero Instrument) -->
  <g transform="translate(460, 80) rotate(32)" filter="url(#neonFilter)">
    <!-- Guitar Body -->
    <path d="M40,160 C10,210 20,290 80,310 C140,330 180,270 170,220 C165,190 140,185 130,165 C120,145 140,120 120,95 C100,70 65,95 50,115 C35,135 45,150 40,160 Z" fill="url(#neonPink)" stroke="#ffffff" stroke-width="2" />
    <ellipse cx="100" cy="225" rx="45" ry="35" fill="#18181b" />
    <!-- Pickguard -->
    <path d="M60,150 Q120,140 140,180 Q145,240 100,260 Z" fill="#ffffff" opacity="0.85" />
    <!-- Pickups -->
    <rect x="75" y="170" width="50" height="12" rx="3" fill="#18181b" stroke="#e2e8f0" stroke-width="1" />
    <rect x="75" y="195" width="50" height="12" rx="3" fill="#18181b" stroke="#e2e8f0" stroke-width="1" />
    <!-- Neck -->
    <rect x="88" y="-60" width="24" height="170" fill="#fed7aa" stroke="#78350f" stroke-width="1" />
    <!-- Frets -->
    <line x1="88" y1="-30" x2="112" y2="-30" stroke="#94a3b8" stroke-width="2" />
    <line x1="88" y1="0" x2="112" y2="0" stroke="#94a3b8" stroke-width="2" />
    <line x1="88" y1="30" x2="112" y2="30" stroke="#94a3b8" stroke-width="2" />
    <line x1="88" y1="60" x2="112" y2="60" stroke="#94a3b8" stroke-width="2" />
    <line x1="88" y1="90" x2="112" y2="90" stroke="#94a3b8" stroke-width="2" />
    <!-- Headstock -->
    <polygon points="86,-60 114,-60 125,-110 86,-105" fill="#f43f5e" />
  </g>

  <!-- KARAOKE MICROPHONE (Glowing in Front) -->
  <g transform="translate(320, 190) rotate(-20)" filter="url(#neonFilter)">
    <!-- Mesh Grille -->
    <circle cx="50" cy="50" r="28" fill="#e2e8f0" stroke="#38bdf8" stroke-width="3" />
    <!-- Mesh crosshatch -->
    <ellipse cx="50" cy="50" rx="20" ry="26" fill="none" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="22" y1="50" x2="78" y2="50" stroke="#94a3b8" stroke-width="1.5" />
    <!-- Handle -->
    <polygon points="38,76 62,76 56,180 44,180" fill="#1e293b" stroke="#64748b" stroke-width="1.5" />
    <!-- Grip Ring & Switch -->
    <rect x="42" y="85" width="16" height="5" fill="#38bdf8" />
    <rect x="46" y="115" width="8" height="15" rx="2" fill="#ef4444" />
  </g>
</svg>
