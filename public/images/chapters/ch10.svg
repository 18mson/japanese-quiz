<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Warm Garden Sunlit Gradient -->
    <linearGradient id="gardenBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="45%" stop-color="#ecfdf5" />
      <stop offset="100%" stop-color="#d1fae5" />
    </linearGradient>

    <!-- Engawa Porch Wood Gradient -->
    <linearGradient id="engawaWood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Calico Cat Colors -->
    <linearGradient id="catBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>

    <filter id="catShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#78350f" flood-opacity="0.2" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#gardenBg)" />

  <!-- Bamboo Garden Backdrop -->
  <g opacity="0.35">
    <rect x="520" y="20" width="12" height="300" rx="4" fill="#059669" />
    <rect x="560" y="10" width="14" height="310" rx="4" fill="#10b981" />
    <rect x="610" y="30" width="11" height="290" rx="4" fill="#059669" />
    <rect x="660" y="15" width="15" height="305" rx="4" fill="#10b981" />
    <rect x="710" y="25" width="12" height="295" rx="4" fill="#047857" />
    <!-- Bamboo Nodes -->
    <line x1="518" y1="80" x2="534" y2="80" stroke="#047857" stroke-width="3" />
    <line x1="518" y1="160" x2="534" y2="160" stroke="#047857" stroke-width="3" />
    <line x1="558" y1="95" x2="576" y2="95" stroke="#047857" stroke-width="3" />
    <line x1="558" y1="190" x2="576" y2="190" stroke="#047857" stroke-width="3" />
    <line x1="658" y1="110" x2="677" y2="110" stroke="#047857" stroke-width="3" />
  </g>

  <!-- Wooden Engawa Porch Planks -->
  <polygon points="0,290 800,270 800,450 0,450" fill="url(#engawaWood)" />
  <line x1="0" y1="330" x2="800" y2="310" stroke="#92400e" stroke-width="2.5" />
  <line x1="0" y1="375" x2="800" y2="355" stroke="#92400e" stroke-width="2.5" />
  <line x1="0" y1="420" x2="800" y2="400" stroke="#92400e" stroke-width="2.5" />
  <line x1="0" y1="290" x2="800" y2="270" stroke="#fcd34d" stroke-width="3" opacity="0.6" />

  <!-- POTTED BONSAI TREE ON PORCH -->
  <g transform="translate(620, 220)" filter="url(#catShadow)">
    <!-- Ceramic Pot -->
    <polygon points="10,65 90,65 80,95 20,95" fill="#334155" stroke="#1e293b" stroke-width="1.5" />
    <!-- Gnarled Trunk -->
    <path d="M50,65 Q40,35 60,20 Q45,10 50,-10" fill="none" stroke="#78350f" stroke-width="9" stroke-linecap="round" />
    <path d="M55,25 Q70,18 80,5" fill="none" stroke="#78350f" stroke-width="5" stroke-linecap="round" />
    <!-- Pine Foliage Clouds -->
    <ellipse cx="45" cy="-12" rx="28" ry="14" fill="#047857" />
    <ellipse cx="80" cy="5" rx="22" ry="12" fill="#059669" />
    <ellipse cx="35" cy="15" rx="18" ry="10" fill="#10b981" />
  </g>

  <!-- CUTE SLEEPING CALICO CAT (MIKE-NEKO: HERO ELEMENT) -->
  <g transform="translate(360, 250)" filter="url(#catShadow)">
    <!-- Cat Shadow -->
    <ellipse cx="110" cy="95" rx="95" ry="25" fill="#451a03" opacity="0.35" />

    <!-- Sleeping Curled Body -->
    <ellipse cx="110" cy="70" rx="75" ry="50" fill="url(#catBody)" stroke="#cbd5e1" stroke-width="1.5" />

    <!-- Calico Patches (Orange & Black) -->
    <!-- Orange patch on back -->
    <path d="M70,40 Q110,35 125,65 Q95,85 65,70 Z" fill="#ea580c" />
    <!-- Black patch on flank -->
    <path d="M125,50 Q165,45 170,80 Q135,90 120,75 Z" fill="#1e293b" />

    <!-- Cat Head Curled in Sleep -->
    <circle cx="55" cy="72" r="32" fill="url(#catBody)" stroke="#cbd5e1" stroke-width="1.5" />
    <!-- Calico patch on head -->
    <path d="M35,50 Q60,45 65,65 Q45,75 35,50 Z" fill="#ea580c" />
    <path d="M65,55 Q80,50 82,70 Q70,75 65,55 Z" fill="#1e293b" />

    <!-- Ears -->
    <polygon points="32,55 42,32 54,50" fill="#f87171" stroke="#cbd5e1" stroke-width="1" />
    <polygon points="62,50 75,32 84,55" fill="#1e293b" stroke="#cbd5e1" stroke-width="1" />

    <!-- Closed Sleeping Eyes (Happy curves ^_^) -->
    <path d="M38,72 Q44,78 50,72" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round" />
    <path d="M58,72 Q64,78 70,72" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round" />
    <!-- Cute pink nose & mouth -->
    <polygon points="53,78 57,78 55,81" fill="#f43f5e" />
    <path d="M51,83 Q55,86 59,83" fill="none" stroke="#475569" stroke-width="1.5" />

    <!-- Whiskers -->
    <line x1="28" y1="75" x2="15" y2="72" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
    <line x1="28" y1="80" x2="16" y2="82" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
    <line x1="72" y1="75" x2="85" y2="72" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
    <line x1="72" y1="80" x2="84" y2="82" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />

    <!-- Paws tucked in -->
    <ellipse cx="75" cy="100" rx="14" ry="9" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />

    <!-- Curled Tail with orange tip -->
    <path d="M180,80 Q200,90 195,110 Q180,120 160,110" fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round" />
    <path d="M180,80 Q192,86 195,95" fill="none" stroke="#ea580c" stroke-width="14" stroke-linecap="round" />
  </g>
</svg>
