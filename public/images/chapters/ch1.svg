<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="sakuraSpringSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="45%" stop-color="#fdf2f8" />
      <stop offset="100%" stop-color="#fce7f3" />
    </linearGradient>
    <linearGradient id="sakuraPetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbcfe8" />
      <stop offset="60%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="cardGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <filter id="gentleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#4f46e5" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Spring Pastel Sky -->
  <rect width="800" height="450" fill="url(#sakuraSpringSky)" />

  <!-- Soft Distant Tokyo City Silhouette in Spring Mist -->
  <g fill="#cbd5e1" opacity="0.35">
    <rect x="360" y="220" width="45" height="120" rx="3" />
    <rect x="420" y="190" width="60" height="150" rx="4" />
    <polygon points="450,130 448,190 452,190" stroke="#94a3b8" stroke-width="2" />
    <rect x="500" y="240" width="55" height="100" rx="3" />
    <rect x="575" y="210" width="70" height="130" rx="4" />
    <rect x="665" y="250" width="50" height="90" rx="3" />
  </g>

  <!-- Pavement / Promenade Ground (Cobblestone Path with Sakura Petals) -->
  <polygon points="0,340 800,295 800,450 0,450" fill="#f1f5f9" />
  <line x1="0" y1="340" x2="800" y2="295" stroke="#e2e8f0" stroke-width="2" />

  <!-- SAKURA BRANCH OVERHEAD FRAMING THE SCENE -->
  <g transform="translate(520, -20)" filter="url(#gentleShadow)">
    <!-- Branch wood -->
    <path d="M280,0 Q180,65 110,50 Q50,40 -20,95" fill="none" stroke="#451a03" stroke-width="8" stroke-linecap="round" />
    <path d="M110,50 Q90,95 30,120" fill="none" stroke="#451a03" stroke-width="4.5" stroke-linecap="round" />
    <!-- Blossoms Clusters -->
    <g fill="url(#sakuraPetal)" opacity="0.9">
      <circle cx="-15" cy="98" r="14" />
      <circle cx="2" cy="90" r="15" />
      <circle cx="28" cy="115" r="16" />
      <circle cx="45" cy="105" r="14" />
      <circle cx="95" cy="55" r="18" />
      <circle cx="118" cy="45" r="16" />
      <circle cx="140" cy="62" r="15" />
      <circle cx="185" cy="42" r="20" />
      <circle cx="210" cy="55" r="18" />
      <circle cx="240" cy="35" r="16" />
      <!-- Flower Center Pistils -->
      <circle cx="28" cy="115" r="3" fill="#ffffff" />
      <circle cx="95" cy="55" r="3.5" fill="#ffffff" />
      <circle cx="185" cy="42" r="4" fill="#ffffff" />
    </g>
  </g>

  <!-- TWO PEOPLE BOWING POLITELY (OJIGI) & EXCHANGING NAME CARDS (MEISHI) -->
  <g transform="translate(360, 150)" filter="url(#gentleShadow)">

    <!-- PERSON 1 (LEFT: MALE, BOWING FORWARD) -->
    <g transform="translate(50, 20)">
      <!-- Shadow on floor under feet -->
      <ellipse cx="28" cy="180" rx="35" ry="10" fill="#64748b" opacity="0.3" />

      <!-- Legs & Slacks Navy: Perfectly positioned under the torso bottom (x=0 to x=50) -->
      <line x1="18" y1="116" x2="18" y2="180" stroke="#1e293b" stroke-width="12" stroke-linecap="round" />
      <line x1="36" y1="118" x2="36" y2="180" stroke="#1e293b" stroke-width="12" stroke-linecap="round" />
      <!-- Shoes -->
      <ellipse cx="18" cy="182" rx="10" ry="5" fill="#0f172a" />
      <ellipse cx="36" cy="182" rx="10" ry="5" fill="#0f172a" />

      <!-- Torso: Swapped body shape (matched with navy/purple colors) -->
      <path d="M60,60 L20,45 L0,115 L50,120 Z" fill="#312e81" stroke="#1e1b4b" stroke-width="1.5" />

      <!-- White Shirt Collar & Blue Tie: Shifted down and tilted to match head angle -->
      <g transform="translate(52, 55) rotate(14)">
        <polygon points="-6,0 6,-1 7,22 -5,23" fill="#ffffff" />
        <polygon points="-2,1 3,1 4,33 -1,34" fill="#3b82f6" />
        <polygon points="-2.5,0 3.5,0 2.5,6 -1.5,6" fill="#2563eb" />
      </g>

      <!-- Head in respectful slight bow: Resting seamlessly on top of collar & torso (cy=34) -->
      <circle cx="51" cy="34" r="18" fill="#fed7aa" />
      <!-- Dark Neat Hair -->
      <path d="M35,34 C35,19 48,16 61,20 C69,24 69,34 67,42 C63,36 58,36 53,40 C48,37 41,38 35,34 Z" fill="#0f172a" />

      <!-- Arms: Originating naturally from inside torso extending forward -->
      <path d="M35,72 L75,82 L95,80" fill="none" stroke="#312e81" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="97" cy="80" r="5" fill="#fed7aa" />
    </g>

    <!-- PERSON 2 (RIGHT: FEMALE, RETURNING BOW WITH WARM SMILE) -->
    <g transform="translate(195, 20)">
      <!-- Shadow on floor under feet -->
      <ellipse cx="55" cy="180" rx="36" ry="10" fill="#64748b" opacity="0.3" />

      <!-- Legs / Charcoal Pencil Skirt & Slacks: Perfectly positioned under the torso bottom (x=30 to x=80) -->
      <line x1="44" y1="118" x2="44" y2="180" stroke="#334155" stroke-width="11" stroke-linecap="round" />
      <line x1="60" y1="116" x2="60" y2="180" stroke="#334155" stroke-width="11" stroke-linecap="round" />
      <ellipse cx="44" cy="182" rx="9" ry="5" fill="#0f172a" />
      <ellipse cx="60" cy="182" rx="9" ry="5" fill="#0f172a" />

      <!-- Torso: Swapped body shape (matched with teal/green colors) -->
      <path d="M20,60 L60,45 L80,115 L30,120 Z" fill="#0d9488" stroke="#115e59" stroke-width="1.5" />

      <!-- White Collar: Rotated counter-clockwise to match jacket angle -->
      <g transform="translate(28, 54) rotate(-14)">
        <polygon points="-6,0 6,-1 7,24 -5,25" fill="#ffffff" />
      </g>

      <!-- Head in respectful bow: Resting seamlessly on top of collar & torso (cy=34) -->
      <circle cx="29" cy="34" r="18" fill="#fed7aa" />
      <!-- Dark Ponytail Hair -->
      <path d="M45,34 C45,19 32,16 19,20 C11,24 11,34 13,42 C17,36 22,36 27,40 C32,37 39,38 45,34 Z" fill="#1e1b4b" />
      <ellipse cx="47" cy="38" rx="6" ry="12" fill="#1e1b4b" transform="rotate(20, 47, 38)" />

      <!-- Arms: Originating naturally from inside torso extending forward -->
      <path d="M45,72 L5,82 L-15,80" fill="none" stroke="#0d9488" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="-17" cy="80" r="5" fill="#fed7aa" />
    </g>

    <!-- FLOATING MEISHI BUSINESS CARDS IN CENTER (HERO DETAIL) -->
    <!-- Card held nicely between the hands -->
    <g transform="translate(136, 85) rotate(-4)">
      <rect x="0" y="0" width="54" height="33" rx="2.5" fill="url(#cardGold)" stroke="#cbd5e1" stroke-width="1" />
      <!-- Corporate navy accent strip -->
      <rect x="0" y="0" width="5" height="33" rx="1" fill="#4338ca" />
      <!-- Name text lines -->
      <line x1="12" y1="11" x2="36" y2="11" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
      <line x1="12" y1="19" x2="46" y2="19" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" />
      <line x1="12" y1="24" x2="32" y2="24" stroke="#94a3b8" stroke-width="1.2" stroke-linecap="round" />
    </g>

    <!-- Japanese Speech Bubble (Hajimemashite!) -->
    <g transform="translate(100, -28)">
      <rect x="0" y="0" width="130" height="36" rx="18" fill="#ffffff" stroke="#e0e7ff" stroke-width="1.5" />
      <polygon points="65,36 75,36 70,46" fill="#ffffff" />
      <text x="65" y="23" font-size="12" font-family="'Hiragino Kaku Gothic Pro', 'Noto Sans JP', sans-serif" font-weight="bold" fill="#4338ca" text-anchor="middle">初めまして！</text>
    </g>
  </g>

  <!-- FLUTTERING SAKURA PETALS IN THE BREEZE -->
  <g fill="url(#sakuraPetal)" opacity="0.8">
    <path d="M330,120 C336,110 348,114 346,124 C342,132 328,126 330,120 Z" transform="rotate(25, 338, 120)" />
    <path d="M480,90 C486,80 498,84 496,94 C492,102 478,96 480,90 Z" transform="rotate(-15, 488, 90)" />
    <path d="M620,160 C626,150 638,154 636,164 C632,172 618,166 620,160 Z" transform="rotate(40, 628, 160)" />
    <path d="M380,290 C386,280 398,284 396,294 C392,302 378,296 380,290 Z" transform="rotate(-30, 388, 290)" />
    <path d="M570,320 C576,310 588,314 586,324 C582,332 568,326 570,320 Z" transform="rotate(10, 578, 320)" />
    <path d="M690,260 C696,250 708,254 706,264 C702,272 688,266 690,260 Z" transform="rotate(65, 698, 260)" />
  </g>
</svg>
