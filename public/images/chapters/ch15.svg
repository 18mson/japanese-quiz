<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Gallery Wall Neutral Slate & Spotlight Gradient -->
    <linearGradient id="galleryWall" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Museum Ceiling Spotlight Cone -->
    <linearGradient id="spotCone" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#f8fafc" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#f8fafc" stop-opacity="0" />
    </linearGradient>

    <!-- Picture Frame Gold Gradient -->
    <linearGradient id="frameGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#eab308" />
      <stop offset="85%" stop-color="#a16207" />
      <stop offset="100%" stop-color="#713f12" />
    </linearGradient>

    <filter id="galleryShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#galleryWall)" />

  <!-- Overhead Spotlight Cone Illuminating Artwork -->
  <polygon points="500,0 520,0 680,360 340,360" fill="url(#spotCone)" />

  <!-- Polished Museum Wood Parquet Floor -->
  <polygon points="0,350 800,330 800,450 0,450" fill="#451a03" />
  <polygon points="0,350 800,330 800,365 0,385" fill="#78350f" opacity="0.6" />
  <line x1="0" y1="350" x2="800" y2="330" stroke="#a16207" stroke-width="2" />

  <!-- FRAMED ARTWORK ON GALLERY WALL (HERO ELEMENT) -->
  <g transform="translate(390, 80)" filter="url(#galleryShadow)">
    <!-- Ornate Golden Frame -->
    <rect x="0" y="0" width="240" height="175" rx="6" fill="url(#frameGold)" stroke="#facc15" stroke-width="2" />
    <!-- White Museum Mat Board -->
    <rect x="18" y="18" width="204" height="139" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" />
    <!-- Painting Canvas: Great Wave Art -->
    <rect x="30" y="30" width="180" height="115" fill="#0284c7" />
    <!-- Stylized Wave & Mt Fuji inside painting -->
    <polygon points="120,110 145,65 170,110" fill="#1e1b4b" />
    <polygon points="145,65 135,82 145,88 155,82" fill="#ffffff" />
    <!-- Cresting Wave -->
    <path d="M30,145 Q80,75 125,70 Q110,85 95,95 Q140,80 155,100 L180,145 Z" fill="#0369a1" />
    <path d="M30,145 Q75,70 115,70 Q105,80 90,88 Q130,75 145,95 L180,145 Z" fill="#ffffff" stroke="#0284c7" stroke-width="1.5" />

    <!-- Museum Description Label Card -->
    <g transform="translate(90, 185)">
      <rect x="0" y="0" width="60" height="24" rx="2" fill="#ffffff" stroke="#cbd5e1" stroke-width="0.8" />
      <line x1="10" y1="8" x2="50" y2="8" stroke="#1e293b" stroke-width="2" />
      <line x1="10" y1="14" x2="38" y2="14" stroke="#64748b" stroke-width="1.5" />
    </g>
  </g>

  <!-- BRASS MUSEUM STANCHION POSTS WITH VELVET ROPE -->
  <g transform="translate(260, 270)" filter="url(#galleryShadow)">
    <!-- Post 1 (Left) -->
    <ellipse cx="40" cy="120" rx="22" ry="8" fill="#ca8a04" />
    <rect x="36" y="20" width="8" height="100" fill="url(#frameGold)" />
    <circle cx="40" cy="18" r="9" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5" />

    <!-- Post 2 (Right) -->
    <ellipse cx="360" cy="115" rx="22" ry="8" fill="#ca8a04" />
    <rect x="356" y="15" width="8" height="100" fill="url(#frameGold)" />
    <circle cx="360" cy="13" r="9" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5" />

    <!-- Braided Red Velvet Rope -->
    <path d="M40,25 Q200,85 360,20" fill="none" stroke="#be123c" stroke-width="8" stroke-linecap="round" />
    <path d="M40,25 Q200,85 360,20" fill="none" stroke="#f43f5e" stroke-width="3" stroke-linecap="round" />
  </g>
</svg>
