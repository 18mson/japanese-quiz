<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="kyotoTwilightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="35%" stop-color="#1e1b4b" />
      <stop offset="70%" stop-color="#4c1d95" />
      <stop offset="100%" stop-color="#9d174d" />
    </linearGradient>
    <linearGradient id="pagodaWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="60%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#271005" />
    </linearGradient>
    <linearGradient id="bridgeVermilion" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="50%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <linearGradient id="stoneLantern" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="60%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="pondGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="templeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
    </filter>
    <filter id="lanternGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#facc15" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Serene Kyoto Twilight Evening Sky -->
  <rect width="800" height="450" fill="url(#kyotoTwilightSky)" />

  <!-- Luminous Golden Full Moon (Meigetsu) -->
  <circle cx="460" cy="120" r="50" fill="#fef08a" opacity="0.9" filter="url(#lanternGlow)" />
  <circle cx="460" cy="120" r="65" fill="#fef08a" opacity="0.15" />

  <!-- Distant Kyoto Higashiyama Mountain Ridges Silhouette -->
  <path d="M0,280 Q200,220 400,260 T800,240 L800,450 L0,450 Z" fill="#1e1b4b" opacity="0.6" />
  <path d="M200,290 Q450,240 680,270 T800,260 L800,450 L200,450 Z" fill="#0f172a" opacity="0.75" />

  <!-- HISTORIC KYOTO FIVE-STORY PAGODA (GOUJUU-NO-TOU / YASAKA PAGODA - HERO ARCHITECTURE) -->
  <g transform="translate(560, 40)" filter="url(#templeShadow)">
    <!-- Base Foundation Stone Tier -->
    <rect x="55" y="240" width="70" height="20" fill="#475569" stroke="#334155" stroke-width="1.5" />

    <!-- TIER 1 (BOTTOM) -->
    <rect x="65" y="195" width="50" height="45" fill="url(#pagodaWood)" stroke="#271005" stroke-width="1.5" />
    <!-- Tier 1 Curved Eaves Roof -->
    <path d="M30,195 Q90,185 150,195 L142,205 Q90,195 38,205 Z" fill="#1e293b" stroke="#0f172a" stroke-width="1.5" />

    <!-- TIER 2 -->
    <rect x="70" y="160" width="40" height="35" fill="url(#pagodaWood)" stroke="#271005" stroke-width="1.5" />
    <path d="M38,160 Q90,152 142,160 L135,168 Q90,160 45,168 Z" fill="#1e293b" stroke="#0f172a" stroke-width="1.5" />

    <!-- TIER 3 -->
    <rect x="74" y="128" width="32" height="32" fill="url(#pagodaWood)" stroke="#271005" stroke-width="1.5" />
    <path d="M45,128 Q90,121 135,128 L129,135 Q90,128 51,135 Z" fill="#1e293b" stroke="#0f172a" stroke-width="1.5" />

    <!-- TIER 4 -->
    <rect x="77" y="98" width="26" height="30" fill="url(#pagodaWood)" stroke="#271005" stroke-width="1.5" />
    <path d="M52,98 Q90,92 128,98 L123,104 Q90,98 57,104 Z" fill="#1e293b" stroke="#0f172a" stroke-width="1.5" />

    <!-- TIER 5 (TOP) -->
    <rect x="80" y="70" width="20" height="28" fill="url(#pagodaWood)" stroke="#271005" stroke-width="1.5" />
    <path d="M58,70 Q90,65 122,70 L117,76 Q90,70 63,76 Z" fill="#1e293b" stroke="#0f172a" stroke-width="1.5" />

    <!-- BRASS SORIN SPIRE (FINIAL NEEDLE ON ROOFTOP) -->
    <line x1="90" y1="70" x2="90" y2="10" stroke="#ca8a04" stroke-width="3" />
    <!-- Spire Rings (Kurumawa) -->
    <ellipse cx="90" cy="55" rx="8" ry="2.5" fill="#facc15" />
    <ellipse cx="90" cy="48" rx="7.5" ry="2.5" fill="#facc15" />
    <ellipse cx="90" cy="41" rx="7" ry="2.5" fill="#facc15" />
    <ellipse cx="90" cy="34" rx="6.5" ry="2.5" fill="#facc15" />
    <ellipse cx="90" cy="27" rx="6" ry="2" fill="#facc15" />
    <ellipse cx="90" cy="20" rx="5.5" ry="2" fill="#facc15" />
    <circle cx="90" cy="10" r="4" fill="#fef08a" />
  </g>

  <!-- SERENE TEMPLE KOI POND (SHIZUKA NA IKE) -->
  <polygon points="0,310 800,270 800,450 0,450" fill="url(#pondGrad)" />
  <line x1="0" y1="310" x2="800" y2="270" stroke="#059669" stroke-width="2" />

  <!-- Water Reflections of Pagoda & Full Moon -->
  <ellipse cx="460" cy="340" rx="45" ry="8" fill="#fef08a" opacity="0.3" filter="url(#lanternGlow)" />
  <polygon points="630,270 655,270 650,420 625,420" fill="#1e293b" opacity="0.4" />

  <!-- Water Ripples -->
  <g stroke="#34d399" stroke-width="1" opacity="0.3" fill="none">
    <ellipse cx="420" cy="370" rx="80" ry="12" />
    <ellipse cx="580" cy="390" rx="110" ry="15" />
    <ellipse cx="490" cy="420" rx="140" ry="18" />
  </g>

  <!-- TRADITIONAL RED ARCHED BRIDGE (TAIKO-BASHI - HERO ELEMENT) -->
  <g transform="translate(310, 240)" filter="url(#templeShadow)">
    <!-- Arch Bridge Wooden Walkway Deck -->
    <path d="M0,75 Q110,15 220,70 L220,84 Q110,29 0,89 Z" fill="url(#bridgeVermilion)" stroke="#7f1d1d" stroke-width="2" />
    <path d="M0,89 Q110,29 220,84 L220,95 Q110,40 0,100 Z" fill="#7f1d1d" />

    <!-- Vermilion Railing Posts with Brass Giboshi Finials -->
    <!-- Post 1 (Left) -->
    <line x1="20" y1="64" x2="20" y2="40" stroke="#b91c1c" stroke-width="6" stroke-linecap="round" />
    <circle cx="20" cy="38" r="4.5" fill="#facc15" stroke="#a16207" stroke-width="1" />
    <!-- Post 2 (Mid-Left) -->
    <line x1="70" y1="42" x2="70" y2="18" stroke="#b91c1c" stroke-width="6" stroke-linecap="round" />
    <circle cx="70" cy="16" r="4.5" fill="#facc15" stroke="#a16207" stroke-width="1" />
    <!-- Post 3 (Crest) -->
    <line x1="110" y1="36" x2="110" y2="12" stroke="#b91c1c" stroke-width="6" stroke-linecap="round" />
    <circle cx="110" cy="10" r="4.5" fill="#facc15" stroke="#a16207" stroke-width="1" />
    <!-- Post 4 (Mid-Right) -->
    <line x1="150" y1="42" x2="150" y2="18" stroke="#b91c1c" stroke-width="6" stroke-linecap="round" />
    <circle cx="150" cy="16" r="4.5" fill="#facc15" stroke="#a16207" stroke-width="1" />
    <!-- Post 5 (Right) -->
    <line x1="200" y1="62" x2="200" y2="38" stroke="#b91c1c" stroke-width="6" stroke-linecap="round" />
    <circle cx="200" cy="36" r="4.5" fill="#facc15" stroke="#a16207" stroke-width="1" />

    <!-- Top Curved Handrail -->
    <path d="M10,50 Q110,-5 210,48" fill="none" stroke="#ef4444" stroke-width="5" stroke-linecap="round" />
    <path d="M10,50 Q110,-5 210,48" fill="none" stroke="#7f1d1d" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- JAPANESE STONE LANTERN (ISHI-DOUROU - LIT AT DUSK) -->
  <g transform="translate(260, 275)" filter="url(#templeShadow)">
    <!-- Base Platform Stone -->
    <ellipse cx="25" cy="115" rx="22" ry="7" fill="url(#stoneLantern)" />
    <!-- Pillar Shaft -->
    <rect x="20" y="65" width="10" height="50" rx="2" fill="url(#stoneLantern)" stroke="#334155" stroke-width="1" />
    <!-- Middle Platform (Chuudai) -->
    <polygon points="12,65 38,65 32,55 18,55" fill="url(#stoneLantern)" />
    <!-- Light Chamber (Hibukuro) with Warm Golden Glow -->
    <rect x="16" y="38" width="18" height="17" fill="#facc15" stroke="#475569" stroke-width="1.5" filter="url(#lanternGlow)" />
    <rect x="22" y="38" width="6" height="17" fill="#ca8a04" />
    <!-- Umbrella Roof (Kasa) with Upturned Corners -->
    <polygon points="6,38 44,38 34,22 16,22" fill="url(#stoneLantern)" stroke="#334155" stroke-width="1" />
    <!-- Jewel Top Finial (Houju) -->
    <circle cx="25" cy="18" r="4.5" fill="url(#stoneLantern)" />
  </g>

  <!-- AUTUMN JAPANESE MAPLE (MOMIJI) BRANCH IN FOREGROUND -->
  <g transform="translate(420, -20)" filter="url(#templeShadow)">
    <path d="M380,0 Q260,80 180,60 Q100,40 20,110" fill="none" stroke="#451a03" stroke-width="7" stroke-linecap="round" />
    <path d="M180,60 Q150,110 80,135" fill="none" stroke="#451a03" stroke-width="4" stroke-linecap="round" />
    <!-- Momiji Crimson Star Leaf Clusters -->
    <g fill="#ef4444" stroke="#b91c1c" stroke-width="0.8">
      <circle cx="35" cy="112" r="14" />
      <circle cx="55" cy="125" r="16" fill="#dc2626" />
      <circle cx="85" cy="135" r="15" fill="#f97316" />
      <circle cx="115" cy="120" r="18" fill="#dc2626" />
      <circle cx="170" cy="75" r="17" fill="#ef4444" />
      <circle cx="200" cy="65" r="16" fill="#f97316" />
      <circle cx="230" cy="72" r="19" fill="#dc2626" />
      <circle cx="270" cy="50" r="16" fill="#ef4444" />
    </g>
  </g>
</svg>
