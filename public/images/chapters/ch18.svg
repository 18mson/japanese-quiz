<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="talentSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="skiSnow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#e0f2fe" />
      <stop offset="100%" stop-color="#bae6fd" />
    </linearGradient>
    <linearGradient id="skiRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#9f1239" />
    </linearGradient>
    <linearGradient id="goldMedal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#a16207" />
    </linearGradient>
    <filter id="talentGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Deep Alpine & Stage Sky -->
  <rect width="800" height="450" fill="url(#talentSky)" />

  <!-- Background Snowy Mountain Slope (Skiing / Winter Sports) -->
  <polygon points="180,360 480,120 720,380" fill="url(#skiSnow)" opacity="0.4" />
  <polygon points="380,380 620,160 840,400" fill="url(#skiSnow)" opacity="0.6" />
  <!-- Snow Peaks -->
  <polygon points="480,120 440,170 470,165 480,178 510,160" fill="#ffffff" />
  <polygon points="620,160 590,205 615,200 625,215 650,195" fill="#ffffff" />

  <!-- Pair of Pro Skis and Poles planted in snow slope -->
  <g transform="translate(620, 190) rotate(16)" filter="url(#talentGlow)">
    <!-- Ski 1 -->
    <path d="M0,0 Q-4,-25 10,-35 L16,-32 Q5,-20 8,0 L18,170 L6,170 Z" fill="url(#skiRed)" stroke="#be123c" stroke-width="1.5" />
    <rect x="4" y="60" width="12" height="18" rx="2" fill="#0f172a" />
    <!-- Ski 2 -->
    <path d="M22,10 Q18,-15 32,-25 L38,-22 Q27,-10 30,10 L40,180 L28,180 Z" fill="#0284c7" stroke="#0369a1" stroke-width="1.5" />
    <rect x="26" y="70" width="12" height="18" rx="2" fill="#0f172a" />
    <!-- Ski Pole with basket -->
    <line x1="-15" y1="-20" x2="35" y2="150" stroke="#cbd5e1" stroke-width="3" />
    <ellipse cx="28" cy="130" rx="10" ry="4" fill="none" stroke="#e2e8f0" stroke-width="2" />
  </g>

  <!-- SWIMMING GOGGLES (Dekiru koto: Oyogu koto) -->
  <g transform="translate(480, 290) rotate(-10)" filter="url(#talentGlow)">
    <!-- Strap -->
    <path d="M-40,15 Q30,-5 120,10" fill="none" stroke="#06b6d4" stroke-width="5" stroke-linecap="round" />
    <!-- Left Lens -->
    <ellipse cx="20" cy="18" rx="26" ry="18" fill="#0284c7" stroke="#38bdf8" stroke-width="3" />
    <ellipse cx="20" cy="18" rx="20" ry="13" fill="#67e8f9" opacity="0.6" />
    <!-- Bridge -->
    <path d="M42,16 Q48,13 54,16" fill="none" stroke="#0891b2" stroke-width="4" />
    <!-- Right Lens -->
    <ellipse cx="76" cy="18" rx="26" ry="18" fill="#0284c7" stroke="#38bdf8" stroke-width="3" />
    <ellipse cx="76" cy="18" rx="20" ry="13" fill="#67e8f9" opacity="0.6" />
  </g>

  <!-- CURVING PIANO KEYBOARD (MUSIC & TALENT - HERO ELEMENT) -->
  <g transform="translate(320, 240) rotate(-14)" filter="url(#talentGlow)">
    <!-- White Keys Base Bed -->
    <rect x="0" y="0" width="380" height="110" rx="8" fill="#0f172a" stroke="#334155" stroke-width="2" />

    <!-- 15 White Keys -->
    <g fill="#ffffff" stroke="#cbd5e1" stroke-width="1">
      <rect x="5" y="4" width="22" height="102" rx="3" />
      <rect x="29" y="4" width="22" height="102" rx="3" />
      <rect x="53" y="4" width="22" height="102" rx="3" />
      <rect x="77" y="4" width="22" height="102" rx="3" />
      <rect x="101" y="4" width="22" height="102" rx="3" />
      <rect x="125" y="4" width="22" height="102" rx="3" />
      <rect x="149" y="4" width="22" height="102" rx="3" />
      <rect x="173" y="4" width="22" height="102" rx="3" />
      <rect x="197" y="4" width="22" height="102" rx="3" />
      <rect x="221" y="4" width="22" height="102" rx="3" />
      <rect x="245" y="4" width="22" height="102" rx="3" />
      <rect x="269" y="4" width="22" height="102" rx="3" />
      <rect x="293" y="4" width="22" height="102" rx="3" />
      <rect x="317" y="4" width="22" height="102" rx="3" />
      <rect x="341" y="4" width="22" height="102" rx="3" />
    </g>

    <!-- Black Keys (standard 2-3 piano groupings) -->
    <g fill="#1e293b" stroke="#020617" stroke-width="1.5">
      <!-- 2-group -->
      <rect x="20" y="4" width="14" height="62" rx="2" />
      <rect x="44" y="4" width="14" height="62" rx="2" />
      <!-- 3-group -->
      <rect x="92" y="4" width="14" height="62" rx="2" />
      <rect x="116" y="4" width="14" height="62" rx="2" />
      <rect x="140" y="4" width="14" height="62" rx="2" />
      <!-- 2-group -->
      <rect x="188" y="4" width="14" height="62" rx="2" />
      <rect x="212" y="4" width="14" height="62" rx="2" />
      <!-- 3-group -->
      <rect x="260" y="4" width="14" height="62" rx="2" />
      <rect x="284" y="4" width="14" height="62" rx="2" />
      <rect x="308" y="4" width="14" height="62" rx="2" />
    </g>
  </g>

  <!-- FLOATING GOLDEN MUSICAL NOTES & SPARKLES -->
  <g fill="url(#goldMedal)" filter="url(#talentGlow)">
    <!-- Treble Clef Stylized -->
    <g transform="translate(390, 70) scale(1.1)">
      <circle cx="20" cy="40" r="10" fill="none" stroke="url(#goldMedal)" stroke-width="4" />
      <line x1="28" y1="10" x2="28" y2="75" stroke="url(#goldMedal)" stroke-width="4.5" stroke-linecap="round" />
      <path d="M28,10 Q50,-10 32,20 Q12,50 28,75" fill="none" stroke="url(#goldMedal)" stroke-width="4" />
      <circle cx="22" cy="78" r="5" fill="url(#goldMedal)" />
    </g>

    <!-- Beam Eighth Notes -->
    <g transform="translate(530, 60)">
      <circle cx="15" cy="40" r="7" />
      <circle cx="45" cy="30" r="7" />
      <line x1="20" y1="40" x2="20" y2="10" stroke="url(#goldMedal)" stroke-width="3.5" />
      <line x1="50" y1="30" x2="50" y2="0" stroke="url(#goldMedal)" stroke-width="3.5" />
      <polygon points="18,10 52,0 52,7 18,17" />
    </g>

    <!-- Single Quarter Note -->
    <g transform="translate(650, 90)">
      <circle cx="15" cy="25" r="7" />
      <line x1="20" y1="25" x2="20" y2="0" stroke="url(#goldMedal)" stroke-width="3.5" />
      <path d="M20,0 Q35,5 30,18" fill="none" stroke="url(#goldMedal)" stroke-width="3.5" stroke-linecap="round" />
    </g>

    <!-- Sparkles -->
    <path d="M470,120 Q480,120 480,110 Q480,120 490,120 Q480,120 480,130 Q480,120 470,120 Z" />
    <path d="M600,140 Q608,140 608,132 Q608,140 616,140 Q608,140 608,148 Q608,140 600,140 Z" />
  </g>
</svg>
