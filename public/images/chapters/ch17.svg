<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="clinicBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5" />
      <stop offset="50%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <linearGradient id="capsuleRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <linearGradient id="capsuleWhite" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="clipBoardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="clinicShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Clean Pharmacy / Clinic Background -->
  <rect width="800" height="450" fill="url(#clinicBg)" />

  <!-- Subtle Medical Cross Patterns in background -->
  <g fill="#10b981" opacity="0.12">
    <!-- Big faint cross -->
    <path d="M640,60 h40 v-40 h30 v40 h40 v30 h-40 v40 h-30 v-40 h-40 z" />
    <path d="M420,40 h24 v-24 h18 v24 h24 v18 h-24 v24 h-18 v-24 h-24 z" />
    <path d="M520,160 h20 v-20 h16 v20 h20 v16 h-20 v20 h-16 v-20 h-20 z" opacity="0.08" />
  </g>

  <!-- Desk Surface -->
  <polygon points="0,320 800,280 800,450 0,450" fill="#f8fafc" />
  <line x1="0" y1="320" x2="800" y2="280" stroke="#cbd5e1" stroke-width="2" />

  <!-- CLINICAL CLIPBOARD (HEALTH CHECK & OBLIGATIONS) -->
  <g transform="translate(360, 65) rotate(-4)" filter="url(#clinicShadow)">
    <!-- Wooden board back -->
    <rect x="-8" y="-8" width="220" height="300" rx="14" fill="#b45309" stroke="#78350f" stroke-width="2" />
    <!-- White paper sheet -->
    <rect x="0" y="0" width="204" height="284" rx="8" fill="url(#clipBoardBg)" />
    <!-- Silver Top Clip -->
    <rect x="52" y="-14" width="100" height="28" rx="6" fill="#94a3b8" stroke="#475569" stroke-width="2" />
    <circle cx="102" cy="-4" r="5" fill="#f8fafc" />

    <!-- Japanese Medical Header Text lines -->
    <rect x="25" y="30" width="90" height="10" rx="3" fill="#059669" />
    <circle cx="170" cy="35" r="10" fill="#10b981" />
    <path d="M166,35 h8 M170,31 v8" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />

    <!-- Checklist items (Bentuk ~nakereba narimasen: Minum obat, istirahat cukup) -->
    <!-- Item 1 -->
    <g transform="translate(25, 60)">
      <rect x="0" y="0" width="18" height="18" rx="4" fill="#ecfdf5" stroke="#10b981" stroke-width="2" />
      <path d="M4,9 L8,13 L14,5" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <rect x="30" y="4" width="115" height="8" rx="2" fill="#64748b" />
    </g>

    <!-- Item 2 -->
    <g transform="translate(25, 95)">
      <rect x="0" y="0" width="18" height="18" rx="4" fill="#ecfdf5" stroke="#10b981" stroke-width="2" />
      <path d="M4,9 L8,13 L14,5" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <rect x="30" y="4" width="100" height="8" rx="2" fill="#64748b" />
    </g>

    <!-- Item 3 -->
    <g transform="translate(25, 130)">
      <rect x="0" y="0" width="18" height="18" rx="4" fill="#ecfdf5" stroke="#10b981" stroke-width="2" />
      <path d="M4,9 L8,13 L14,5" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
      <rect x="30" y="4" width="125" height="8" rx="2" fill="#64748b" />
    </g>

    <!-- Item 4 (Unchecked: Larangan / Tak perlu) -->
    <g transform="translate(25, 165)">
      <rect x="0" y="0" width="18" height="18" rx="4" fill="#fef2f2" stroke="#f43f5e" stroke-width="2" />
      <!-- Small X mark -->
      <path d="M5,5 L13,13 M13,5 L5,13" stroke="#f43f5e" stroke-width="2" stroke-linecap="round" />
      <rect x="30" y="4" width="85" height="8" rx="2" fill="#94a3b8" />
    </g>

    <!-- Doctor's Hanko Stamp (Red Circle Stamp) -->
    <circle cx="160" cy="235" r="20" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="1 0" />
    <text x="160" y="240" font-size="12" font-family="sans-serif" font-weight="bold" fill="#dc2626" text-anchor="middle">医印</text>
  </g>

  <!-- FOREGROUND PHARMACY ESSENTIALS -->
  <!-- 1. Blister Pack of Tablets -->
  <g transform="translate(560, 240) rotate(8)" filter="url(#clinicShadow)">
    <rect x="0" y="0" width="130" height="90" rx="8" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5" />
    <!-- 6 Foil blisters -->
    <ellipse cx="28" cy="26" rx="14" ry="12" fill="#38bdf8" stroke="#0284c7" stroke-width="1.5" />
    <ellipse cx="65" cy="26" rx="14" ry="12" fill="#38bdf8" stroke="#0284c7" stroke-width="1.5" />
    <ellipse cx="102" cy="26" rx="14" ry="12" fill="#38bdf8" stroke="#0284c7" stroke-width="1.5" />
    <ellipse cx="28" cy="64" rx="14" ry="12" fill="#38bdf8" stroke="#0284c7" stroke-width="1.5" />
    <ellipse cx="65" cy="64" rx="14" ry="12" fill="#38bdf8" stroke="#0284c7" stroke-width="1.5" />
    <ellipse cx="102" cy="64" rx="14" ry="12" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5" opacity="0.6" />
    <!-- Blister shine highlights -->
    <ellipse cx="25" cy="22" rx="5" ry="3" fill="#ffffff" opacity="0.7" />
    <ellipse cx="62" cy="22" rx="5" ry="3" fill="#ffffff" opacity="0.7" />
  </g>

  <!-- 2. Medical Capsule Floating Duo -->
  <g transform="translate(490, 275) rotate(-22)" filter="url(#clinicShadow)">
    <rect x="0" y="0" width="22" height="30" rx="11" fill="url(#capsuleRed)" />
    <rect x="0" y="30" width="22" height="30" rx="11" fill="url(#capsuleWhite)" stroke="#cbd5e1" stroke-width="0.5" />
    <line x1="0" y1="30" x2="22" y2="30" stroke="#991b1b" stroke-width="1" />
  </g>

  <!-- 3. Digital Clinical Thermometer -->
  <g transform="translate(290, 290) rotate(24)" filter="url(#clinicShadow)">
    <!-- White tapered body -->
    <path d="M0,8 L130,8 L145,12 L130,16 L0,16 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
    <!-- Silver sensor tip -->
    <path d="M130,8 L145,12 L130,16 Z" fill="#94a3b8" />
    <!-- LCD Display -->
    <rect x="35" y="9.5" width="45" height="11" rx="2" fill="#dcfce7" stroke="#86efac" stroke-width="0.8" />
    <text x="57" y="18" font-size="7" font-family="monospace" font-weight="bold" fill="#15803d" text-anchor="middle">36.5°C</text>
    <circle cx="95" cy="12" r="3" fill="#3b82f6" />
  </g>
</svg>
