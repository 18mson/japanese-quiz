<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="morningSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="50%" stop-color="#fef3c7" />
      <stop offset="100%" stop-color="#fed7aa" />
    </linearGradient>
    <linearGradient id="sunBeam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="tableWood" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    <linearGradient id="trayWood" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
    <linearGradient id="salmonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <linearGradient id="teaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#84cc16" />
      <stop offset="100%" stop-color="#4d7c0f" />
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Warm Morning Sunlight -->
  <rect width="800" height="450" fill="url(#morningSky)" />

  <!-- Diagonal Sunbeams Through Shoji Window -->
  <polygon points="0,0 220,0 480,450 150,450" fill="url(#sunBeam)" />
  <polygon points="260,0 420,0 660,450 450,450" fill="url(#sunBeam)" opacity="0.6" />

  <!-- Window Frame in Background (Right) -->
  <g transform="translate(560, 40)" opacity="0.35">
    <rect x="0" y="0" width="200" height="180" rx="8" fill="#ffffff" stroke="#b45309" stroke-width="4" />
    <line x1="100" y1="0" x2="100" y2="180" stroke="#b45309" stroke-width="3" />
    <line x1="0" y1="90" x2="200" y2="90" stroke="#b45309" stroke-width="3" />
    <!-- Green Bonsai on Sill -->
    <ellipse cx="140" cy="180" rx="20" ry="6" fill="#78350f" />
    <circle cx="140" cy="165" r="14" fill="#15803d" />
    <circle cx="132" cy="160" r="10" fill="#22c55e" />
    <circle cx="150" cy="160" r="9" fill="#16a34a" />
  </g>

  <!-- Wooden Dining Table Surface -->
  <polygon points="0,210 800,180 800,450 0,450" fill="url(#tableWood)" />
  <line x1="0" y1="210" x2="800" y2="180" stroke="#fde68a" stroke-width="2" opacity="0.6" />

  <!-- TRADITIONAL JAPANESE BREAKFAST TRAY (TEISHOKU) -->
  <g transform="translate(340, 195)" filter="url(#softShadow)">
    <!-- Lacquer Serving Tray -->
    <rect x="0" y="0" width="420" height="230" rx="16" fill="url(#trayWood)" stroke="#92400e" stroke-width="3" />

    <!-- 1. BOWL OF WHITE RICE (GOHAN) -->
    <g transform="translate(45, 95)">
      <!-- Rice Bowl -->
      <ellipse cx="55" cy="90" rx="42" ry="12" fill="#0369a1" />
      <path d="M15,50 C15,95 95,95 95,50 Z" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5" />
      <!-- Steaming Fluffy White Rice Mound -->
      <ellipse cx="55" cy="50" rx="40" ry="24" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
      <circle cx="45" cy="42" r="12" fill="#ffffff" />
      <circle cx="65" cy="45" r="14" fill="#ffffff" />
      <circle cx="55" cy="38" r="10" fill="#ffffff" />
      <!-- Steam Wisps -->
      <path d="M45,26 Q40,16 48,6" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />
      <path d="M62,28 Q68,18 60,8" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.5" />
    </g>

    <!-- 2. BOWL OF MISO SOUP (MISOSHIRU) -->
    <g transform="translate(160, 95)">
      <!-- Lacquered Bowl Red/Black -->
      <ellipse cx="50" cy="90" rx="40" ry="10" fill="#450a0a" />
      <path d="M12,50 C12,95 88,95 88,50 Z" fill="#991b1b" stroke="#ef4444" stroke-width="1.5" />
      <!-- Miso Broth Surface -->
      <ellipse cx="50" cy="50" rx="36" ry="18" fill="#d97706" />
      <!-- Tofu cubes & Wakame seaweed -->
      <rect x="36" y="44" width="9" height="9" rx="1" fill="#fef08a" />
      <rect x="52" y="48" width="8" height="8" rx="1" fill="#fef08a" />
      <circle cx="48" cy="40" r="3" fill="#14532d" />
      <circle cx="62" cy="42" r="2.5" fill="#14532d" />
      <!-- Green spring onion garnish -->
      <ellipse cx="38" cy="56" rx="4" ry="2" fill="#22c55e" />
      <ellipse cx="60" cy="54" rx="3" ry="1.5" fill="#22c55e" />
    </g>

    <!-- 3. GRILLED SALMON ON CERAMIC DISH (YAKIZAKANA) -->
    <g transform="translate(60, 20)">
      <!-- Long Rectangular Ceramic Plate -->
      <rect x="0" y="0" width="180" height="65" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" />
      <!-- Shiso Leaf garnish -->
      <path d="M20,32 Q45,15 70,32 Q45,45 20,32 Z" fill="#16a34a" />
      <!-- Grilled Salmon Fillet -->
      <path d="M45,40 C55,20 125,20 145,40 C130,52 65,52 45,40 Z" fill="url(#salmonGrad)" />
      <!-- Charred crispy grill lines -->
      <line x1="65" y1="26" x2="80" y2="46" stroke="#881337" stroke-width="2.5" stroke-linecap="round" />
      <line x1="90" y1="25" x2="105" y2="45" stroke="#881337" stroke-width="2.5" stroke-linecap="round" />
      <line x1="115" y1="27" x2="130" y2="47" stroke="#881337" stroke-width="2.5" stroke-linecap="round" />
      <!-- Grated Daikon Radish with Soy sauce drop -->
      <circle cx="155" cy="35" r="9" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
      <circle cx="155" cy="35" r="3" fill="#78350f" />
    </g>

    <!-- 4. HOT GREEN TEA YUNOMI CUP -->
    <g transform="translate(285, 30)">
      <ellipse cx="30" cy="75" rx="22" ry="6" fill="#0f172a" opacity="0.3" />
      <!-- Ceramic Cup Body with Blue Floral Pattern -->
      <path d="M12,25 L16,75 L44,75 L48,25 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
      <ellipse cx="30" cy="25" rx="18" ry="7" fill="url(#teaGrad)" stroke="#65a30d" stroke-width="1" />
      <!-- Blue Japanese floral motif -->
      <path d="M24,45 Q30,38 36,45 Q30,52 24,45 Z" fill="#3b82f6" />
    </g>

    <!-- 5. CHOPSTICKS (HASHI) ON CERAMIC REST (HASHIOKI) -->
    <g transform="translate(60, 200)">
      <!-- Ceramic Hashioki Mount Fuji Shape -->
      <polygon points="40,15 48,5 56,15" fill="#0284c7" />
      <polygon points="45,9 48,5 51,9" fill="#ffffff" />
      <!-- Pair of Sleek Wooden Chopsticks -->
      <line x1="30" y1="9" x2="260" y2="9" stroke="#b45309" stroke-width="3" stroke-linecap="round" />
      <line x1="30" y1="14" x2="260" y2="14" stroke="#d97706" stroke-width="3" stroke-linecap="round" />
      <!-- Red tipped handle -->
      <line x1="225" y1="9" x2="260" y2="9" stroke="#dc2626" stroke-width="3.5" stroke-linecap="round" />
      <line x1="225" y1="14" x2="260" y2="14" stroke="#dc2626" stroke-width="3.5" stroke-linecap="round" />
    </g>
  </g>
</svg>
