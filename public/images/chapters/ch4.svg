<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Background morning gradient -->
    <linearGradient id="bgMorning" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1eb" />
      <stop offset="50%" stop-color="#fed6e3" />
      <stop offset="100%" stop-color="#d5eeff" />
    </linearGradient>

    <!-- Warm sun rays gradient -->
    <linearGradient id="sunRay" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffedd5" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#fef08a" stop-opacity="0" />
    </linearGradient>

    <!-- Clock face gradient -->
    <linearGradient id="clockGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Desk wood gradient -->
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="50%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <!-- Coffee cup gradient -->
    <linearGradient id="cupGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>

    <!-- Soft shadow filter -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4338ca" flood-opacity="0.15" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Sky & Wall Canvas -->
  <rect width="800" height="450" fill="url(#bgMorning)" />

  <!-- Morning Sunbeams streaming through window -->
  <polygon points="120,-20 480,-20 720,450 320,450" fill="url(#sunRay)" opacity="0.45" />
  <polygon points="260,-20 580,-20 840,450 480,450" fill="url(#sunRay)" opacity="0.3" />

  <!-- Shoji Window Frame Architecture (Right Side) -->
  <g opacity="0.65">
    <rect x="520" y="30" width="240" height="340" rx="12" fill="#ffffff" fill-opacity="0.5" stroke="#94a3b8" stroke-width="4" />
    <!-- Grid Lines -->
    <line x1="520" y1="115" x2="760" y2="115" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    <line x1="520" y1="200" x2="760" y2="200" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    <line x1="520" y1="285" x2="760" y2="285" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    <line x1="600" y1="30" x2="600" y2="370" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    <line x1="680" y1="30" x2="680" y2="370" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Sakura Silhouette Outside Window -->
  <g opacity="0.4">
    <circle cx="680" cy="90" r="28" fill="#fda4af" />
    <circle cx="710" cy="75" r="22" fill="#f472b6" />
    <circle cx="730" cy="110" r="25" fill="#fb7185" />
    <circle cx="640" cy="80" r="20" fill="#fbcfe8" />
  </g>

  <!-- THE CLOCK (Hero Thematic Element for Time / Jam) -->
  <g filter="url(#shadow)">
    <!-- Outer Rim -->
    <circle cx="340" cy="180" r="110" fill="#ffffff" stroke="#f1f5f9" stroke-width="6" />
    <circle cx="340" cy="180" r="102" fill="none" stroke="url(#clockGold)" stroke-width="5" />
    <circle cx="340" cy="180" r="95" fill="#f8fafc" />

    <!-- Clock Hour Ticks -->
    <!-- 12, 3, 6, 9 -->
    <line x1="340" y1="95" x2="340" y2="112" stroke="#1e293b" stroke-width="4" stroke-linecap="round" />
    <line x1="425" y1="180" x2="408" y2="180" stroke="#1e293b" stroke-width="4" stroke-linecap="round" />
    <line x1="340" y1="265" x2="340" y2="248" stroke="#1e293b" stroke-width="4" stroke-linecap="round" />
    <line x1="255" y1="180" x2="272" y2="180" stroke="#1e293b" stroke-width="4" stroke-linecap="round" />

    <!-- 1, 2, 4, 5, 7, 8, 10, 11 ticks -->
    <circle cx="387" cy="100" r="3" fill="#64748b" />
    <circle cx="420" cy="133" r="3" fill="#64748b" />
    <circle cx="420" cy="227" r="3" fill="#64748b" />
    <circle cx="387" cy="260" r="3" fill="#64748b" />
    <circle cx="293" cy="260" r="3" fill="#64748b" />
    <circle cx="260" cy="227" r="3" fill="#64748b" />
    <circle cx="260" cy="133" r="3" fill="#64748b" />
    <circle cx="293" cy="100" r="3" fill="#64748b" />

    <!-- Japanese Characters for 7:00 AM (七時) -->
    <text x="340" y="150" font-family="'Noto Sans JP', sans-serif" font-size="13" font-weight="bold" fill="#94a3b8" text-anchor="middle">午前 7:00</text>

    <!-- Clock Hands (Showing 7:00 Morning - Start of Day) -->
    <!-- Hour Hand pointing to 7 -->
    <line x1="340" y1="180" x2="305" y2="225" stroke="#1e293b" stroke-width="5" stroke-linecap="round" />
    <!-- Minute Hand pointing to 12 -->
    <line x1="340" y1="180" x2="340" y2="115" stroke="#0f172a" stroke-width="4" stroke-linecap="round" />
    <!-- Second Hand (Red Accent - Torii) -->
    <line x1="340" y1="195" x2="340" y2="105" stroke="#ef4444" stroke-width="2" stroke-linecap="round" />
    <circle cx="340" cy="180" r="6" fill="#ef4444" />
    <circle cx="340" cy="180" r="3" fill="#ffffff" />
  </g>

  <!-- Foreground Desk Surface -->
  <polygon points="0,370 800,370 800,450 0,450" fill="url(#woodGrad)" />
  <line x1="0" y1="370" x2="800" y2="370" stroke="#fcd34d" stroke-width="3" opacity="0.6" />

  <!-- Study Calendar on Desk -->
  <g transform="translate(140, 310)" filter="url(#shadow)">
    <rect x="0" y="0" width="85" height="75" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />
    <path d="M0 0 h85 v22 H0 z" fill="#ef4444" rx="8" />
    <text x="42.5" y="16" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">CALENDAR</text>
    <text x="42.5" y="52" font-family="sans-serif" font-size="28" font-weight="900" fill="#1e293b" text-anchor="middle">4</text>
    <text x="42.5" y="66" font-family="sans-serif" font-size="8" font-weight="bold" fill="#64748b" text-anchor="middle">TODAY</text>
  </g>

  <!-- Steaming Coffee Cup -->
  <g transform="translate(460, 315)" filter="url(#shadow)">
    <!-- Saucer -->
    <ellipse cx="45" cy="62" rx="35" ry="8" fill="#cbd5e1" />
    <ellipse cx="45" cy="60" rx="32" ry="7" fill="#f8fafc" />
    <!-- Mug Body -->
    <rect x="22" y="22" width="46" height="38" rx="8" fill="url(#cupGrad)" stroke="#cbd5e1" stroke-width="1.5" />
    <!-- Handle -->
    <path d="M68 30 C 80 30, 80 50, 68 50" fill="none" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" />
    <!-- Coffee Surface -->
    <ellipse cx="45" cy="26" rx="20" ry="5" fill="#78350f" />
    <!-- Steam Curls -->
    <path d="M38 18 Q 42 10 38 4 Q 34 -2 40 -8" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.75" />
    <path d="M50 16 Q 54 8 50 2 Q 46 -4 52 -10" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.65" />
  </g>

  <!-- Open Study Notebook -->
  <g transform="translate(240, 335)">
    <polygon points="0,25 60,10 120,25 110,65 55,55 0,65" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" />
    <polygon points="60,10 120,25 110,65 55,55" fill="#ffffff" />
    <line x1="58" y1="12" x2="55" y2="55" stroke="#94a3b8" stroke-width="2" />
    <!-- Text Lines -->
    <line x1="15" y1="28" x2="48" y2="20" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
    <line x1="14" y1="36" x2="46" y2="28" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
    <line x1="13" y1="44" x2="44" y2="36" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
    <line x1="68" y1="20" x2="102" y2="28" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
    <line x1="66" y1="28" x2="100" y2="36" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
    <line x1="64" y1="36" x2="98" y2="44" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
    <!-- Yellow Pen -->
    <line x1="125" y1="18" x2="145" y2="48" stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round" />
  </g>
</svg>
