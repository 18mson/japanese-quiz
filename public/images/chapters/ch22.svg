<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="warmStudioBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="50%" stop-color="#fef3c7" />
      <stop offset="100%" stop-color="#fed7aa" />
    </linearGradient>
    <linearGradient id="redRoofGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="60%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <linearGradient id="glassesGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <filter id="studioShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#78350f" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- Warm Aesthetic Paper Studio Background -->
  <rect width="800" height="450" fill="url(#warmStudioBg)" />

  <!-- Ground / Studio Floor -->
  <polygon points="0,320 800,280 800,450 0,450" fill="#f8fafc" />
  <line x1="0" y1="320" x2="800" y2="280" stroke="#cbd5e1" stroke-width="2" />

  <!-- 1. THE CHARMING RED-ROOFED HOUSE (AKAI YANE NO IE - CHAPTER 22 GRAMMAR CLUSTER) -->
  <g transform="translate(520, 100)" filter="url(#studioShadow)">
    <!-- House Garden Lawn Base -->
    <ellipse cx="110" cy="220" rx="130" ry="25" fill="#86efac" opacity="0.6" />

    <!-- Cute Japanese Suburban House Walls -->
    <rect x="35" y="90" width="150" height="110" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />

    <!-- Pitched Gable Red Roof (Hero Element) -->
    <polygon points="110,15 15,95 205,95" fill="url(#redRoofGrad)" stroke="#7f1d1d" stroke-width="2" />
    <polygon points="110,15 205,95 215,90 120,10" fill="#b91c1c" />

    <!-- Brick Chimney with tiny smoke puff -->
    <rect x="150" y="25" width="22" height="35" fill="#991b1b" stroke="#7f1d1d" stroke-width="1.5" />
    <ellipse cx="161" cy="25" rx="11" ry="3" fill="#7f1d1d" />
    <circle cx="165" cy="12" r="6" fill="#cbd5e1" opacity="0.7" />
    <circle cx="172" cy="2" r="8" fill="#e2e8f0" opacity="0.5" />

    <!-- Wooden Front Door with Awning -->
    <rect x="95" y="140" width="30" height="60" rx="3" fill="#b45309" stroke="#78350f" stroke-width="1.5" />
    <circle cx="120" cy="172" r="2.5" fill="#facc15" />
    <rect x="90" y="134" width="40" height="6" rx="2" fill="#78350f" />

    <!-- Windows with Cross Frames & Warm Glow -->
    <!-- Window Left -->
    <rect x="50" y="125" width="32" height="32" rx="3" fill="#fef08a" stroke="#d97706" stroke-width="2" />
    <line x1="66" y1="125" x2="66" y2="157" stroke="#d97706" stroke-width="1.5" />
    <line x1="50" y1="141" x2="82" y2="141" stroke="#d97706" stroke-width="1.5" />

    <!-- Window Right -->
    <rect x="138" y="125" width="32" height="32" rx="3" fill="#fef08a" stroke="#d97706" stroke-width="2" />
    <line x1="154" y1="125" x2="154" y2="157" stroke="#d97706" stroke-width="1.5" />
    <line x1="138" y1="141" x2="170" y2="141" stroke="#d97706" stroke-width="1.5" />

    <!-- Garden Shrub Tree next to house -->
    <rect x="200" y="170" width="8" height="40" fill="#78350f" />
    <circle cx="204" cy="160" r="24" fill="#15803d" />
    <circle cx="196" cy="150" r="18" fill="#22c55e" />
    <circle cx="214" cy="155" r="16" fill="#16a34a" />
  </g>

  <!-- 2. STYLISH ROUND GLASSES & BOOK (MEGANE O KAKETE IRU HITO / HON O YONDE IRU HITO) -->
  <g transform="translate(320, 160)" filter="url(#studioShadow)">
    <!-- Classic Open Book -->
    <g transform="translate(40, 90)">
      <!-- Book Pages Opened -->
      <path d="M0,45 Q60,30 110,40 L110,120 Q60,110 0,125 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
      <path d="M220,45 Q160,30 110,40 L110,120 Q160,110 220,125 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5" />
      <!-- Book spine & cover shadow -->
      <path d="M-5,48 L110,43 L225,48 L220,128 L110,123 L-5,128 Z" fill="#1e293b" opacity="0.3" />
      <!-- Bookmark ribbon -->
      <path d="M110,40 Q115,70 125,135 L120,140 L115,135 Z" fill="#ef4444" />
      <!-- Japanese text lines printed on pages -->
      <g stroke="#94a3b8" stroke-width="2" stroke-linecap="round">
        <line x1="20" y1="60" x2="95" y2="58" />
        <line x1="20" y1="75" x2="90" y2="73" />
        <line x1="20" y1="90" x2="85" y2="88" />
        <line x1="20" y1="105" x2="70" y2="103" />

        <line x1="130" y1="58" x2="200" y2="60" />
        <line x1="130" y1="73" x2="195" y2="75" />
        <line x1="130" y1="88" x2="200" y2="90" />
        <line x1="130" y1="103" x2="175" y2="105" />
      </g>
    </g>

    <!-- FLOATING ICONIC VINTAGE ROUND GLASSES (HERO ELEMENT) -->
    <g transform="translate(50, 10) scale(1.15)">
      <!-- Left Rim -->
      <circle cx="50" cy="45" r="32" fill="#e0f2fe" fill-opacity="0.35" stroke="url(#glassesGold)" stroke-width="5" />
      <!-- Left Lens Glare reflection -->
      <path d="M30,30 Q45,22 55,30" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />

      <!-- Golden Bridge -->
      <path d="M82,40 Q95,33 108,40" fill="none" stroke="url(#glassesGold)" stroke-width="4.5" stroke-linecap="round" />

      <!-- Right Rim -->
      <circle cx="140" cy="45" r="32" fill="#e0f2fe" fill-opacity="0.35" stroke="url(#glassesGold)" stroke-width="5" />
      <!-- Right Lens Glare reflection -->
      <path d="M120,30 Q135,22 145,30" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />

      <!-- Left Temple Arm -->
      <path d="M18,44 Q-5,38 -15,55" fill="none" stroke="url(#glassesGold)" stroke-width="4" stroke-linecap="round" />
      <!-- Right Temple Arm -->
      <path d="M172,44 Q195,38 205,55" fill="none" stroke="url(#glassesGold)" stroke-width="4" stroke-linecap="round" />
    </g>
  </g>
</svg>
