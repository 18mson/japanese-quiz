<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Romantic Rose & Gold Morning Gradient -->
    <linearGradient id="giftBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2" />
      <stop offset="50%" stop-color="#ffe4e6" />
      <stop offset="100%" stop-color="#fecdd3" />
    </linearGradient>

    <!-- Furoshiki Wrap Cloth Gradient -->
    <linearGradient id="furoshikiRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>

    <!-- Gold Mizuhiki Cord Gradient -->
    <linearGradient id="goldCord" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <!-- Envelope Paper Gradient -->
    <linearGradient id="envelopePaper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <filter id="giftShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#881337" flood-opacity="0.18" />
    </filter>
  </defs>

  <!-- Ambient Wall -->
  <rect width="800" height="450" fill="url(#giftBg)" />

  <!-- Traditional Asanoha (Hemp Leaf) Japanese Geometric Pattern in Background -->
  <g opacity="0.12" stroke="#be123c" stroke-width="1.5" fill="none">
    <polygon points="500,50 550,136 450,136" />
    <polygon points="600,50 650,136 550,136" />
    <polygon points="700,50 750,136 650,136" />
    <polygon points="550,136 600,222 500,222" />
    <polygon points="650,136 700,222 600,222" />
    <polygon points="500,222 550,308 450,308" />
    <polygon points="600,222 650,308 550,308" />
  </g>

  <!-- Wooden Tatami Desk Surface -->
  <polygon points="0,310 800,290 800,450 0,450" fill="#991b1b" opacity="0.8" />
  <polygon points="0,330 800,310 800,450 0,450" fill="#7f1d1d" />
  <line x1="0" y1="310" x2="800" y2="290" stroke="#fecdd3" stroke-width="2.5" opacity="0.6" />

  <!-- GIFT BOX (HERO ELEMENT: OMIYAGE / HADIAH) -->
  <g transform="translate(350, 160)" filter="url(#giftShadow)">
    <!-- Main Box Body -->
    <polygon points="120,40 220,90 100,150 0,100" fill="#f43f5e" />
    <polygon points="0,100 100,150 100,230 0,180" fill="url(#furoshikiRed)" />
    <polygon points="100,150 220,90 220,170 100,230" fill="#be123c" />

    <!-- Gold Ribbon / Cord Across Box -->
    <polygon points="60,70 160,120 160,200 60,150" fill="url(#goldCord)" opacity="0.9" />
    <polygon points="60,70 160,20 160,40 60,90" fill="url(#goldCord)" opacity="0.9" />

    <!-- Traditional Mizuhiki Knot (Bow Knot on Top of Gift) -->
    <g transform="translate(100, 75)">
      <!-- Left Loop -->
      <path d="M0,0 C-40,-35 -50,15 -10,10" fill="none" stroke="url(#goldCord)" stroke-width="4.5" stroke-linecap="round" />
      <path d="M0,0 C-38,-30 -45,10 -8,7" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
      <!-- Right Loop -->
      <path d="M0,0 C40,-35 50,15 10,10" fill="none" stroke="url(#goldCord)" stroke-width="4.5" stroke-linecap="round" />
      <path d="M0,0 C38,-30 45,10 8,7" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" />
      <!-- Hanging Cords -->
      <path d="M-5,10 Q-20,35 -35,50" fill="none" stroke="url(#goldCord)" stroke-width="4" stroke-linecap="round" />
      <path d="M5,10 Q20,35 35,50" fill="none" stroke="url(#goldCord)" stroke-width="4" stroke-linecap="round" />
      <!-- Knot Center -->
      <circle cx="0" cy="5" r="7" fill="#fbbf24" stroke="#d97706" stroke-width="1.5" />
    </g>
  </g>

  <!-- LETTER & ENVELOPE (TEGAMI: ALAT KOMUNIKASI / TANGAN) -->
  <g transform="translate(180, 260) rotate(-12)" filter="url(#giftShadow)">
    <rect x="0" y="0" width="130" height="85" rx="8" fill="url(#envelopePaper)" stroke="#e2e8f0" stroke-width="1.5" />
    <!-- Flap Lines -->
    <polygon points="0,0 65,48 130,0" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    <!-- Red Cherry Blossom Wax Seal -->
    <circle cx="65" cy="48" r="14" fill="#e11d48" />
    <circle cx="65" cy="48" r="10" fill="#f43f5e" />
    <!-- Sakura Petal Imprint -->
    <path d="M65,42 C67,45 67,47 65,49 C63,47 63,45 65,42 Z" fill="#ffe4e6" />
    <path d="M65,54 C67,51 67,49 65,47 C63,49 63,51 65,54 Z" fill="#ffe4e6" />
    <path d="M59,48 C62,46 64,46 65,48 C64,50 62,50 59,48 Z" fill="#ffe4e6" />
    <path d="M71,48 C68,46 66,46 65,48 C66,50 68,50 71,48 Z" fill="#ffe4e6" />
  </g>

  <!-- JAPANESE CHOPSTICKS (HASHI: ALAT / SARANA) -->
  <g transform="translate(560, 310)" filter="url(#giftShadow)">
    <!-- Paper Chopstick Sleeve (Hashibukuro) -->
    <polygon points="0,35 75,18 78,38 3,55" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <text x="35" y="42" font-family="'Noto Sans JP', sans-serif" font-size="10" font-weight="bold" fill="#be123c">おてもと</text>
    <!-- Chopsticks (Black lacquer with gold tip) -->
    <line x1="15" y1="32" x2="160" y2="-2" stroke="#18181b" stroke-width="4.5" stroke-linecap="round" />
    <line x1="16" y1="40" x2="161" y2="6" stroke="#18181b" stroke-width="4.5" stroke-linecap="round" />
    <!-- Gold Tips -->
    <line x1="145" y1="1" x2="160" y2="-2" stroke="#f59e0b" stroke-width="4.5" stroke-linecap="round" />
    <line x1="146" y1="9" x2="161" y2="6" stroke="#f59e0b" stroke-width="4.5" stroke-linecap="round" />
  </g>
</svg>
