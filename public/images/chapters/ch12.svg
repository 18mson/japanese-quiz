<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Midnight Indigo Night Sky Gradient -->
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="60%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>

    <!-- Hanabi Firework Burst Glow -->
    <radialGradient id="fireworkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="1" />
      <stop offset="30%" stop-color="#f43f5e" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#8b5cf6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0" />
    </radialGradient>

    <!-- Lantern Glow -->
    <radialGradient id="matGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0" />
    </radialGradient>

    <filter id="hanabiBloom" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#nightSky)" />

  <!-- HANABI FIREWORKS BURST (HERO ELEMENT) -->
  <g transform="translate(520, 150)" filter="url(#hanabiBloom)">
    <!-- Central Glow Core -->
    <circle cx="0" cy="0" r="120" fill="url(#fireworkGlow)" />
    <circle cx="0" cy="0" r="14" fill="#ffffff" />

    <!-- Exploding Sparklers Rays -->
    <!-- Gold / Yellow Ring -->
    <g stroke="#fef08a" stroke-width="3" stroke-linecap="round">
      <line x1="0" y1="-25" x2="0" y2="-90" stroke-dasharray="8 6" />
      <line x1="18" y1="-18" x2="65" y2="-65" stroke-dasharray="8 6" />
      <line x1="25" y1="0" x2="90" y2="0" stroke-dasharray="8 6" />
      <line x1="18" y1="18" x2="65" y2="65" stroke-dasharray="8 6" />
      <line x1="0" y1="25" x2="0" y2="90" stroke-dasharray="8 6" />
      <line x1="-18" y1="18" x2="-65" y2="65" stroke-dasharray="8 6" />
      <line x1="-25" y1="0" x2="-90" y2="0" stroke-dasharray="8 6" />
      <line x1="-18" y1="-18" x2="-65" y2="-65" stroke-dasharray="8 6" />
    </g>

    <!-- Magenta / Pink Outer Ring -->
    <g stroke="#f43f5e" stroke-width="3.5" stroke-linecap="round">
      <line x1="0" y1="-45" x2="0" y2="-120" stroke-dasharray="10 8" />
      <line x1="32" y1="-32" x2="85" y2="-85" stroke-dasharray="10 8" />
      <line x1="45" y1="0" x2="120" y2="0" stroke-dasharray="10 8" />
      <line x1="32" y1="32" x2="85" y2="85" stroke-dasharray="10 8" />
      <line x1="0" y1="45" x2="0" y2="120" stroke-dasharray="10 8" />
      <line x1="-32" y1="32" x2="-85" y2="85" stroke-dasharray="10 8" />
      <line x1="-45" y1="0" x2="-120" y2="0" stroke-dasharray="10 8" />
      <line x1="-32" y1="-32" x2="-85" y2="-85" stroke-dasharray="10 8" />
    </g>

    <!-- Cyan / Light Blue Sparkle Tips -->
    <circle cx="0" cy="-125" r="4.5" fill="#38bdf8" />
    <circle cx="90" cy="-90" r="4.5" fill="#38bdf8" />
    <circle cx="125" cy="0" r="4.5" fill="#38bdf8" />
    <circle cx="90" cy="90" r="4.5" fill="#38bdf8" />
    <circle cx="0" cy="125" r="4.5" fill="#38bdf8" />
    <circle cx="-90" cy="90" r="4.5" fill="#38bdf8" />
    <circle cx="-125" cy="0" r="4.5" fill="#38bdf8" />
    <circle cx="-90" cy="-90" r="4.5" fill="#38bdf8" />
  </g>

  <!-- Secondary Smaller Fireworks -->
  <g transform="translate(350, 90) scale(0.6)" filter="url(#hanabiBloom)">
    <circle cx="0" cy="0" r="70" fill="url(#fireworkGlow)" />
    <circle cx="0" cy="0" r="9" fill="#ffffff" />
    <g stroke="#38bdf8" stroke-width="3" stroke-linecap="round">
      <line x1="0" y1="-15" x2="0" y2="-65" stroke-dasharray="6 4" />
      <line x1="12" y1="-12" x2="48" y2="-48" stroke-dasharray="6 4" />
      <line x1="15" y1="0" x2="65" y2="0" stroke-dasharray="6 4" />
      <line x1="12" y1="12" x2="48" y2="48" stroke-dasharray="6 4" />
      <line x1="0" y1="15" x2="0" y2="65" stroke-dasharray="6 4" />
      <line x1="-12" y1="12" x2="-48" y2="48" stroke-dasharray="6 4" />
      <line x1="-15" y1="0" x2="-65" y2="0" stroke-dasharray="6 4" />
      <line x1="-12" y1="-12" x2="-48" y2="-48" stroke-dasharray="6 4" />
    </g>
  </g>

  <!-- Distant Temple Pagoda Silhouette -->
  <polygon points="680,260 700,230 720,260" fill="#090d16" />
  <polygon points="675,285 700,260 725,285" fill="#090d16" />
  <polygon points="670,315 700,285 730,315" fill="#090d16" />
  <rect x="690" y="315" width="20" height="40" fill="#090d16" />

  <!-- FESTIVAL ROPE WITH GLOWING LANTERNS (MATSURI CHOOSHIN) -->
  <g>
    <!-- Curved Rope -->
    <path d="M180,310 Q480,260 780,290" fill="none" stroke="#71717a" stroke-width="2.5" />

    <!-- Lantern 1 (Red) -->
    <g transform="translate(300, 265)">
      <ellipse cx="20" cy="40" rx="18" ry="26" fill="#ef4444" stroke="#b91c1c" stroke-width="1.5" />
      <rect x="9" y="12" width="22" height="6" fill="#18181b" rx="2" />
      <rect x="9" y="62" width="22" height="6" fill="#18181b" rx="2" />
      <text x="20" y="46" font-family="'Noto Sans JP', sans-serif" font-size="14" font-weight="bold" fill="#fef08a" text-anchor="middle">祭</text>
      <circle cx="20" cy="40" r="35" fill="url(#matGlow)" />
    </g>

    <!-- Lantern 2 (Gold/Yellow) -->
    <g transform="translate(420, 245)">
      <ellipse cx="20" cy="40" rx="18" ry="26" fill="#f59e0b" stroke="#d97706" stroke-width="1.5" />
      <rect x="9" y="12" width="22" height="6" fill="#18181b" rx="2" />
      <rect x="9" y="62" width="22" height="6" fill="#18181b" rx="2" />
      <text x="20" y="46" font-family="'Noto Sans JP', sans-serif" font-size="14" font-weight="bold" fill="#78350f" text-anchor="middle">夏</text>
      <circle cx="20" cy="40" r="35" fill="url(#matGlow)" />
    </g>

    <!-- Lantern 3 (Red) -->
    <g transform="translate(540, 250)">
      <ellipse cx="20" cy="40" rx="18" ry="26" fill="#ef4444" stroke="#b91c1c" stroke-width="1.5" />
      <rect x="9" y="12" width="22" height="6" fill="#18181b" rx="2" />
      <rect x="9" y="62" width="22" height="6" fill="#18181b" rx="2" />
      <text x="20" y="46" font-family="'Noto Sans JP', sans-serif" font-size="14" font-weight="bold" fill="#fef08a" text-anchor="middle">宵</text>
      <circle cx="20" cy="40" r="35" fill="url(#matGlow)" />
    </g>

    <!-- Lantern 4 (Gold/Yellow) -->
    <g transform="translate(660, 260)">
      <ellipse cx="20" cy="40" rx="18" ry="26" fill="#f59e0b" stroke="#d97706" stroke-width="1.5" />
      <rect x="9" y="12" width="22" height="6" fill="#18181b" rx="2" />
      <rect x="9" y="62" width="22" height="6" fill="#18181b" rx="2" />
      <text x="20" y="46" font-family="'Noto Sans JP', sans-serif" font-size="14" font-weight="bold" fill="#78350f" text-anchor="middle">花</text>
      <circle cx="20" cy="40" r="35" fill="url(#matGlow)" />
    </g>
  </g>

  <!-- Traditional Paper Hand Fan (Uchiwa) -->
  <g transform="translate(220, 310) rotate(-15)">
    <!-- Bamboo Handle -->
    <line x1="45" y1="65" x2="45" y2="135" stroke="#ca8a04" stroke-width="5" stroke-linecap="round" />
    <!-- Fan Body -->
    <circle cx="45" cy="50" r="42" fill="#38bdf8" stroke="#0284c7" stroke-width="2" />
    <!-- Wave print on Fan -->
    <path d="M10,65 Q45,30 80,65" fill="none" stroke="#ffffff" stroke-width="3" />
  </g>
</svg>
