<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="sunsetFlightSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="40%" stop-color="#4338ca" />
      <stop offset="70%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="globeOcean" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#0c4a6e" />
    </linearGradient>
    <linearGradient id="planeBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="goldVictory" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <filter id="planeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.4" />
    </filter>
    <filter id="victoryGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="14" flood-color="#facc15" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Dramatic Sunset Sky above the Clouds -->
  <rect width="800" height="450" fill="url(#sunsetFlightSky)" />

  <!-- Soft Pink/Gold Cumulus Cloud Bank at the Bottom -->
  <g fill="#ffffff" opacity="0.85">
    <ellipse cx="280" cy="430" rx="140" ry="70" />
    <ellipse cx="440" cy="420" rx="160" ry="80" />
    <ellipse cx="620" cy="410" rx="150" ry="75" />
    <ellipse cx="760" cy="430" rx="120" ry="60" />
  </g>
  <g fill="#fed7aa" opacity="0.6">
    <ellipse cx="360" cy="445" rx="120" ry="50" />
    <ellipse cx="540" cy="435" rx="130" ry="55" />
  </g>

  <!-- PLANETARY GLOBE (SEKAI ISSHU - TRAVEL AROUND THE WORLD) -->
  <g transform="translate(520, 110)" filter="url(#planeShadow)">
    <!-- Globe Sphere -->
    <circle cx="100" cy="100" r="90" fill="url(#globeOcean)" stroke="#38bdf8" stroke-width="2" />
    <!-- Lat/Long Grid Lines -->
    <ellipse cx="100" cy="100" rx="90" ry="35" fill="none" stroke="#7dd3fc" stroke-width="1" opacity="0.4" />
    <ellipse cx="100" cy="100" rx="40" ry="90" fill="none" stroke="#7dd3fc" stroke-width="1" opacity="0.4" />

    <!-- Continents Silhouettes in Green/Emerald -->
    <!-- Asia & Japan archipelago -->
    <path d="M70,55 Q90,50 110,65 Q130,80 120,110 Q95,120 80,100 Z" fill="#22c55e" opacity="0.85" />
    <!-- Japanese Island Arc -->
    <path d="M125,65 Q135,70 140,85 Q135,90 125,75 Z" fill="#4ade80" />
    <circle cx="138" cy="80" r="3" fill="#ef4444" /> <!-- Red Dot Tokyo! -->
    <!-- Americas / Pacific Islands -->
    <path d="M35,95 Q45,85 55,115 Q40,140 25,125 Z" fill="#22c55e" opacity="0.75" />

    <!-- Golden Orbit Ring around Globe -->
    <ellipse cx="100" cy="100" rx="125" ry="45" fill="none" stroke="url(#goldVictory)" stroke-width="3" stroke-dasharray="8 6" transform="rotate(-25, 100, 100)" />
  </g>

  <!-- SOARING PASSENGER JET AIRPLANE (HERO ELEMENT) -->
  <g transform="translate(340, 110) rotate(-22)" filter="url(#planeShadow)">
    <!-- Main Fuselage -->
    <path d="M0,45 Q40,42 160,40 Q210,40 240,48 Q210,56 160,56 Q40,54 0,51 Z" fill="url(#planeBody)" stroke="#cbd5e1" stroke-width="1.5" />
    <!-- Cockpit Windshield -->
    <path d="M215,44 Q230,46 235,48 Q228,50 215,50 Z" fill="#0f172a" />

    <!-- Main Swept Wings -->
    <!-- Far Wing -->
    <polygon points="110,40 140,40 160,-20 135,-15" fill="#94a3b8" />
    <polygon points="158,-20 165,-25 160,-15" fill="#dc2626" /> <!-- Winglet Red -->

    <!-- Near Wing (Large Foreground Wing) -->
    <polygon points="100,54 135,54 165,125 135,120" fill="url(#planeBody)" stroke="#94a3b8" stroke-width="1.5" />
    <polygon points="163,125 172,132 160,122" fill="#dc2626" /> <!-- Winglet Red -->

    <!-- Jet Engine Under Near Wing -->
    <rect x="120" y="70" width="35" height="15" rx="7" fill="#64748b" stroke="#334155" stroke-width="1.5" />
    <ellipse cx="155" cy="77" rx="4" ry="7" fill="#1e293b" />
    <!-- Engine Jet Glow Heat Exhaust -->
    <path d="M118,74 L95,77 L118,80 Z" fill="#f59e0b" opacity="0.7" />

    <!-- Tail Fin (Vertical Stabilizer) with Hinomaru Crimson Circle -->
    <polygon points="10,45 35,45 10,-5 0,-5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    <polygon points="8,-5 12,-5 32,45 25,45" fill="#dc2626" />
    <!-- Horizontal Stabilizers -->
    <polygon points="15,45 30,45 38,65 26,65" fill="#94a3b8" />

    <!-- Passenger Cabin Windows -->
    <g fill="#0284c7">
      <circle cx="70" cy="48" r="2.5" />
      <circle cx="85" cy="48" r="2.5" />
      <circle cx="100" cy="48" r="2.5" />
      <circle cx="115" cy="48" r="2.5" />
      <circle cx="130" cy="48" r="2.5" />
      <circle cx="145" cy="48" r="2.5" />
      <circle cx="160" cy="48" r="2.5" />
      <circle cx="175" cy="48" r="2.5" />
      <circle cx="190" cy="48" r="2.5" />
    </g>

    <!-- Sleek Red Japanese Speedline Stripe across Fuselage -->
    <line x1="30" y1="51" x2="215" y2="51" stroke="#dc2626" stroke-width="2.5" />
  </g>

  <!-- GRADUATION DIPLOMA SCROLL (COMPLETION OF MINNA NO NIHONGO SHOKYU 1!) -->
  <g transform="translate(340, 260) rotate(12)" filter="url(#victoryGlow)">
    <!-- Parchment Scroll Body -->
    <rect x="10" y="8" width="130" height="42" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" />
    <!-- Rolled Scroll Ends -->
    <ellipse cx="10" cy="29" rx="8" ry="21" fill="#fde68a" stroke="#d97706" stroke-width="1.5" />
    <ellipse cx="140" cy="29" rx="8" ry="21" fill="#fef08a" stroke="#d97706" stroke-width="1.5" />
    <ellipse cx="10" cy="29" rx="5" ry="16" fill="#b45309" />

    <!-- Tied Red Ribbon Band -->
    <rect x="65" y="8" width="18" height="42" fill="#ef4444" stroke="#b91c1c" stroke-width="1" />
    <!-- Golden Wax Seal Crest -->
    <circle cx="74" cy="29" r="14" fill="url(#goldVictory)" stroke="#b45309" stroke-width="1.5" />
    <text x="74" y="34" font-size="10" font-family="'Hiragino Kaku Gothic Pro', sans-serif" font-weight="900" fill="#78350f" text-anchor="middle">修</text>
    <!-- Ribbon Tails hanging down -->
    <polygon points="68,50 64,80 72,74 76,50" fill="#ef4444" />
    <polygon points="76,50 82,78 74,72 72,50" fill="#dc2626" />
  </g>

  <!-- CELEBRATORY GOLDEN STARS & SPARKLES -->
  <g fill="url(#goldVictory)" filter="url(#victoryGlow)">
    <polygon points="490,60 493,68 502,69 495,75 497,84 490,79 483,84 485,75 478,69 487,68" />
    <polygon points="690,80 692,86 698,87 694,91 695,97 690,94 685,97 686,91 682,87 688,86" transform="scale(0.85)" />
    <polygon points="410,220 412,225 418,226 414,230 415,236 410,233 405,236 406,230 402,226 408,225" />
  </g>
</svg>
