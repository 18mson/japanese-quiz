<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="twilightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="40%" stop-color="#431407" />
      <stop offset="80%" stop-color="#9a3412" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="onsenWater" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#0369a1" />
      <stop offset="100%" stop-color="#075985" />
    </linearGradient>
    <linearGradient id="woodBucket" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="50%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <filter id="onsenGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Twilight Mountain Evening Sky -->
  <rect width="800" height="450" fill="url(#twilightSky)" />

  <!-- MOUNT FUJI SILHOUETTE (CLIMBING EXPERIENCE) -->
  <g transform="translate(420, 80)">
    <!-- Fuji Mountain Body -->
    <polygon points="120,40 30,190 210,190" fill="#312e81" opacity="0.85" />
    <!-- Symmetrical Slopes -->
    <path d="M120,40 C80,110 30,190 30,190 L210,190 C210,190 160,110 120,40 Z" fill="#1e1b4b" />
    <!-- Snowcap with serrated edge -->
    <path d="M120,40 L102,75 L110,88 L120,80 L130,90 L138,75 Z" fill="#ffffff" />
    <!-- Crescent Moon -->
    <path d="M220,20 A16,16 0 1,0 236,44 A13,13 0 1,1 220,20 Z" fill="#fef08a" opacity="0.9" />
  </g>

  <!-- Distant Pine Tree Silhouettes -->
  <g fill="#0f172a" opacity="0.6">
    <polygon points="340,240 330,270 350,270" />
    <polygon points="360,230 348,270 372,270" />
    <polygon points="390,235 378,275 402,275" />
    <polygon points="680,240 670,280 690,280" />
    <polygon points="710,230 698,280 722,280" />
  </g>

  <!-- OUTDOOR HOT SPRING (ROTENBURO) BATH -->
  <!-- Natural Dark River Rocks Border -->
  <g fill="#334155" stroke="#1e293b" stroke-width="2">
    <!-- Rock border rim -->
    <ellipse cx="280" cy="300" rx="35" ry="24" />
    <ellipse cx="340" cy="285" rx="42" ry="26" />
    <ellipse cx="410" cy="275" rx="48" ry="28" fill="#475569" />
    <ellipse cx="485" cy="270" rx="40" ry="24" />
    <ellipse cx="555" cy="270" rx="45" ry="26" />
    <ellipse cx="630" cy="280" rx="48" ry="28" fill="#475569" />
    <ellipse cx="700" cy="295" rx="42" ry="25" />
    <ellipse cx="760" cy="315" rx="38" ry="24" />
  </g>

  <!-- Hot Spring Steaming Pool Surface -->
  <path d="M260,320 Q500,260 760,320 L800,450 L200,450 Z" fill="url(#onsenWater)" />

  <!-- Gentle Water Ripples -->
  <ellipse cx="520" cy="340" rx="90" ry="14" fill="none" stroke="#7dd3fc" stroke-width="2" opacity="0.6" />
  <ellipse cx="520" cy="340" rx="140" ry="20" fill="none" stroke="#7dd3fc" stroke-width="1.5" opacity="0.4" />
  <ellipse cx="520" cy="340" rx="190" ry="26" fill="none" stroke="#7dd3fc" stroke-width="1" opacity="0.25" />

  <!-- Floating Crimson Japanese Maple (Momiji) Leaf -->
  <g transform="translate(620, 345) rotate(25)" filter="url(#onsenGlow)">
    <path d="M0,0 Q-15,-20 0,-35 Q5,-15 15,-25 Q15,-10 28,-15 Q15,0 20,15 Q5,5 0,0 Z" fill="#ef4444" stroke="#b91c1c" stroke-width="1" />
    <line x1="0" y1="0" x2="-8" y2="12" stroke="#b91c1c" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- TRADITIONAL WOODEN OKE BUCKET ON ROCK (HERO ELEMENT) -->
  <g transform="translate(370, 230)" filter="url(#onsenGlow)">
    <!-- Shadow under bucket -->
    <ellipse cx="60" cy="85" rx="48" ry="14" fill="#0f172a" opacity="0.4" />

    <!-- Wooden Staves Tub -->
    <ellipse cx="60" cy="80" rx="42" ry="14" fill="#78350f" />
    <path d="M18,40 L22,80 Q60,94 98,80 L102,40 Q60,26 18,40 Z" fill="url(#woodBucket)" stroke="#78350f" stroke-width="1.5" />
    <!-- Metal Hoops -->
    <path d="M19,52 Q60,38 101,52" fill="none" stroke="#451a03" stroke-width="3" />
    <path d="M21,72 Q60,58 99,72" fill="none" stroke="#451a03" stroke-width="3" />
    <!-- Tub Opening Top Rim -->
    <ellipse cx="60" cy="40" rx="42" ry="14" fill="#92400e" stroke="#78350f" stroke-width="1.5" />
    <ellipse cx="60" cy="40" rx="38" ry="12" fill="#d97706" />

    <!-- Folded White Tenugui Onsen Towel Draped over Bucket Rim -->
    <path d="M42,32 L68,32 L72,68 L40,66 Z" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
    <line x1="42" y1="62" x2="70" y2="64" stroke="#cbd5e1" stroke-width="2" />
  </g>

  <!-- RISING ONSEN STEAM WISPS -->
  <g stroke="#ffffff" stroke-linecap="round" opacity="0.6">
    <!-- Steam 1 -->
    <path d="M460,310 Q445,280 470,250 Q495,220 475,190" fill="none" stroke-width="4" opacity="0.5" />
    <!-- Steam 2 -->
    <path d="M540,320 Q560,285 535,250 Q510,215 530,180" fill="none" stroke-width="5" opacity="0.6" />
    <!-- Steam 3 -->
    <path d="M600,315 Q585,275 610,240 Q630,205 615,170" fill="none" stroke-width="3.5" opacity="0.4" />
  </g>

  <!-- Bamboo Water Spout Trickle -->
  <g transform="translate(230, 260) rotate(-15)">
    <rect x="0" y="0" width="80" height="14" rx="4" fill="#65a30d" stroke="#3f6212" stroke-width="1.5" />
    <ellipse cx="80" cy="7" rx="4" ry="7" fill="#365314" />
    <!-- Trickling Water stream -->
    <path d="M80,7 Q95,40 100,75" fill="none" stroke="#7dd3fc" stroke-width="3" stroke-linecap="round" opacity="0.8" />
  </g>
</svg>
